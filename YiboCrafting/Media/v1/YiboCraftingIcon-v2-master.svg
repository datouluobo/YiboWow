<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>YiboCrafting open recipe book, WoW material study</title>
  <desc>Stage 5 draft. Approved regular hexagon and 3% wider book; directional upper-left light, faceted metal and thick parchment.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#385056"/><stop offset=".42" stop-color="#24343B"/><stop offset="1" stop-color="#0C1B24"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9C4BD"/><stop offset=".29" stop-color="#688A88"/><stop offset=".6" stop-color="#34525A"/><stop offset="1" stop-color="#0D252F"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6AA4A"/><stop offset=".40" stop-color="#CE8D34"/><stop offset=".72" stop-color="#A96B26"/><stop offset="1" stop-color="#703D1C"/>
    </linearGradient>
    <linearGradient id="leftPaper" x1="0" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#FFF9DB"/><stop offset=".29" stop-color="#FFE8A5"/><stop offset=".72" stop-color="#F4C46C"/><stop offset="1" stop-color="#BC742A"/>
    </linearGradient>
    <linearGradient id="rightPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE5A2"/><stop offset=".5" stop-color="#F1BA60"/><stop offset="1" stop-color="#B76A25"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C4D1E"/><stop offset=".38" stop-color="#D28D35"/><stop offset=".62" stop-color="#FFE39A"/><stop offset="1" stop-color="#9B5522"/>
    </linearGradient>
  </defs>

  <!-- The two approved, touching regular hexagons keep their exact geometry. -->
  <path d="M16 1.4 28.64 8.7v14.6L16 30.6 3.36 23.3V8.7Z" fill="url(#field)" stroke="url(#metal)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 1.4 3.36 8.7v14.6" fill="none" stroke="#98B7B0" stroke-width="2.35" stroke-linejoin="round" opacity=".67"/>
  <path d="M28.64 8.7v14.6L16 30.6" fill="none" stroke="#102B35" stroke-width="2.35" stroke-linejoin="round" opacity=".8"/>
  <path d="M3.36 23.3 16 30.6" fill="none" stroke="#426D70" stroke-width="2.35" stroke-linejoin="round" opacity=".6"/>
  <path d="M16 3.05 27.21 9.525v12.95L16 28.95 4.79 22.475V9.525Z" fill="none" stroke="#057B78" stroke-width="1.45" stroke-linejoin="round"/>
  <path d="M16 3.05 4.79 9.525v12.95L16 28.95" fill="none" stroke="#20E4C6" stroke-width="1.14" stroke-linejoin="round"/>
  <path d="M16 3.05 27.21 9.525v12.95L16 28.95" fill="none" stroke="#12BBAA" stroke-width="1.10" stroke-linejoin="round"/>

  <g transform="translate(16 17.5) scale(0.927 0.90) translate(-16 -17.5)">
    <!-- Binding and lower cover are one substantial, dark-edged object. -->
    <path d="M5.4 8.6 12.9 9.2 16 11.4 19.1 9.2 26.6 8.6v15.7l-7.7.7-2.9 2.3-2.9-2.3-7.7-.7Z" fill="url(#cover)" stroke="#683917" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M5.9 9.1 12.8 9.7 16 12 19.2 9.7 26.1 9.1v1.8l-6.7.5-3.4 2.5-3.4-2.5-6.7-.5Z" fill="#F1B954"/>
    <path d="M5.9 9.1 12.8 9.7 16 12l-3.4-2.3-6.7-.6Z" fill="#FFE092" opacity=".9"/>
    <path d="M26.1 9.1 19.2 9.7 16 12l3.4-2.3 6.7-.6Z" fill="#AA6927" opacity=".7"/>
    <path d="M6.1 11v12.6l6.9.7 3 2.2 3-2.2 6.9-.7V11" fill="none" stroke="#6F3B19" stroke-width=".7" opacity=".8"/>
    <path d="M6.4 22.65 12.95 23.2 16 25.45 19.05 23.2 25.6 22.65v1.2l-6.9.65-2.7 2.05-2.7-2.05-6.9-.65Z" fill="#8C4D20" opacity=".8"/>

    <!-- Broad parchment faces; upper-left is the single light source. -->
    <path d="M7.15 10.72c3.2-.06 5.8.66 7.85 2.55v9.92c-2.16-1.46-4.85-1.89-7.85-1.43Z" fill="url(#leftPaper)" stroke="#9E5D25" stroke-width=".55" stroke-linejoin="round"/>
    <path d="M24.85 10.72c-3.2-.06-5.8.66-7.85 2.55v9.92c2.16-1.46 4.85-1.89 7.85-1.43Z" fill="url(#rightPaper)" stroke="#8F501F" stroke-width=".55" stroke-linejoin="round"/>
    <path d="M7.55 11.15c2.75.1 4.75.67 6.86 2.33v5.95c-1.75-1.45-4.05-2.22-6.86-2.15Z" fill="#FFF0BA" opacity=".5"/>
    <path d="M17.5 13.48c1.85-1.56 4.12-2.12 6.92-2.32v5.45c-2.73-.16-4.96.64-6.92 2.12Z" fill="#FFD480" opacity=".22"/>
    <path d="M7.4 21.0c3.05-.38 5.42.17 7.3 1.56l.05.57c-2.04-1.34-4.56-1.69-7.35-1.27Z" fill="#C58032" opacity=".72"/>
    <path d="M17.25 22.56c1.86-1.39 4.27-1.95 7.32-1.56v.86c-2.85-.42-5.28-.05-7.32 1.27Z" fill="#9C5724" opacity=".55"/>

    <!-- A thick, shaded binding separates the page planes. -->
    <path d="M15.0 12.7 16 13.35 17 12.7v10.85L16 25.1l-1-1.55Z" fill="url(#spine)"/>
    <path d="M15.04 13.3v9.65" fill="none" stroke="#8F4B1D" stroke-width=".38" opacity=".85"/>
    <path d="M16.18 13.4v10.7" fill="none" stroke="#FFE3A1" stroke-width=".31" opacity=".9"/>
    <path d="M8.0 11.9c2.4-.04 4.42.69 6.26 2.13" fill="none" stroke="#FFF9DC" stroke-width=".65" stroke-linecap="round"/>
    <path d="M18.0 13.9c1.55-1.1 3.44-1.76 5.25-1.92" fill="none" stroke="#FFE9A8" stroke-width=".48" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
