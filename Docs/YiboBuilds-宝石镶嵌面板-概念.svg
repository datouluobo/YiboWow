<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 600 580" role="img" aria-label="YiboBuilds 装备区宝石镶嵌面板概念图">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #d8eff0; }
      .muted { fill: #84a9af; }
      .small { font-size: 10px; }
      .body { font-size: 12px; }
      .title { font-size: 15px; font-weight: 700; }
      .label { font-size: 11px; font-weight: 700; }
      .slot { fill: #081b20; stroke: #24626a; stroke-width: 1; }
      .item { fill: #14252b; stroke: #9059dc; stroke-width: 1.3; }
      .line { stroke: #27535b; stroke-width: 1; }
    </style>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#0c2227"/>
      <stop offset="1" stop-color="#07191d"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c59656"/>
      <stop offset=".48" stop-color="#5c3650"/>
      <stop offset="1" stop-color="#1c2332"/>
    </linearGradient>
    <linearGradient id="redgem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb682"/>
      <stop offset=".46" stop-color="#ee3c4e"/>
      <stop offset="1" stop-color="#771521"/>
    </linearGradient>
    <linearGradient id="metagem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2b7ff"/>
      <stop offset=".48" stop-color="#9d5ce4"/>
      <stop offset="1" stop-color="#41235f"/>
    </linearGradient>
    <linearGradient id="greengem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d2ff8b"/>
      <stop offset=".48" stop-color="#3ac77c"/>
      <stop offset="1" stop-color="#0c5a45"/>
    </linearGradient>
    <symbol id="gem" viewBox="0 0 30 30">
      <path d="M15 2 26 9 24 21 15 28 6 21 4 9Z" fill="currentColor" opacity=".95"/>
      <path d="m15 2 4 11-4 15-4-15Z M4 9h22M6 21h18" fill="none" stroke="#fff" stroke-opacity=".44" stroke-width="1"/>
    </symbol>
    <symbol id="equip" viewBox="0 0 38 38">
      <rect x=".5" y=".5" width="37" height="37" fill="#12282c" stroke="#8b4ecf"/>
      <path d="m19 5 10 5-3 8-4-2v14H16V16l-4 2-3-8Z" fill="#6e4b39" stroke="#cda46b" stroke-width="1.3"/>
      <path d="m16 16 6 0 M16 22h6" stroke="#e0af73" stroke-width="1.3"/>
    </symbol>
  </defs>

  <rect width="600" height="580" fill="#06161b"/>
  <rect x="10" y="8" width="580" height="564" fill="#041318" stroke="#15424a"/>
  <text x="28" y="34" font-size="14" font-weight="700">装备区 · 镶嵌态</text>
  <text x="570" y="34" font-size="10" text-anchor="end" fill="#25df9a">概念预览</text>
  <line x1="28" y1="44" x2="572" y2="44" class="line"/>

  <text x="45" y="75" class="small muted">头</text>
  <rect x="66" y="52" width="48" height="48" fill="#12313a" stroke="#22e797" stroke-width="2"/>
  <rect x="69" y="55" width="42" height="42" fill="url(#helmet)"/>
  <path d="M75 81Q75 57 90 60q16-3 16 21l-10-5-7 16-6-16Z" fill="#a57a4b" stroke="#f0c879" stroke-width="1.5"/>
  <path d="M78 80h25l-7 13H85Z" fill="#3c263d" stroke="#9b739a"/>
  <rect x="120" y="56" width="18" height="18" fill="#251a34" stroke="#ad77e9"/>
  <use href="#gem" x="121" y="57" width="16" height="16" style="color:#b17aec"/>
  <rect x="141" y="56" width="18" height="18" fill="#331b1f" stroke="#ea515a"/>
  <use href="#gem" x="142" y="57" width="16" height="16" style="color:#ee4456"/>
  <text x="66" y="113" class="small" fill="#22e797">选中装备</text>

  <g opacity=".76">
    <text x="45" y="157" class="small muted">颈</text><use href="#equip" x="70" y="129" width="40" height="40"/>
    <text x="45" y="218" class="small muted">肩</text><use href="#equip" x="70" y="190" width="40" height="40"/>
    <text x="45" y="279" class="small muted">背</text><use href="#equip" x="70" y="251" width="40" height="40"/>
    <text x="45" y="340" class="small muted">胸</text><use href="#equip" x="70" y="312" width="40" height="40"/>
    <text x="45" y="401" class="small muted">衬</text><rect x="70" y="373" width="40" height="40" class="slot"/>
    <text x="45" y="462" class="small muted">袍</text><use href="#equip" x="70" y="434" width="40" height="40"/>
    <text x="45" y="523" class="small muted">腕</text><use href="#equip" x="70" y="495" width="40" height="40"/>
    <text x="528" y="77" class="small muted">手</text><use href="#equip" x="485" y="50" width="40" height="40"/>
    <text x="528" y="138" class="small muted">腰</text><use href="#equip" x="485" y="111" width="40" height="40"/>
    <text x="528" y="199" class="small muted">腿</text><use href="#equip" x="485" y="172" width="40" height="40"/>
    <text x="528" y="260" class="small muted">脚</text><use href="#equip" x="485" y="233" width="40" height="40"/>
    <text x="528" y="321" class="small muted">戒1</text><use href="#equip" x="485" y="294" width="40" height="40"/>
    <text x="528" y="382" class="small muted">戒2</text><use href="#equip" x="485" y="355" width="40" height="40"/>
    <text x="528" y="443" class="small muted">饰1</text><use href="#equip" x="485" y="416" width="40" height="40"/>
    <text x="528" y="504" class="small muted">饰2</text><use href="#equip" x="485" y="477" width="40" height="40"/>
  </g>

  <rect x="177" y="53" width="294" height="472" fill="url(#panel)" stroke="#26818a" stroke-width="1.3"/>
  <rect x="177" y="53" width="294" height="37" fill="#102b30"/>
  <text x="192" y="77" class="title">宝石镶嵌</text>
  <text x="454" y="77" font-size="16" text-anchor="end" fill="#a6c6c9">×</text>

  <rect x="191" y="100" width="34" height="34" fill="url(#helmet)" stroke="#ac72e8"/>
  <path d="M197 125V110q10-12 22 0v15l-6-4-5 8-4-8Z" fill="#bb8b50" stroke="#e0b675"/>
  <text x="235" y="115" class="body" font-weight="700">头部装备</text>
  <text x="235" y="131" class="small muted">2 个孔 · 背包宝石已筛选</text>
  <line x1="191" y1="146" x2="457" y2="146" class="line"/>

  <circle cx="208" cy="173" r="12" fill="#221a2d" stroke="#b884ef" stroke-width="2"/>
  <path d="m208 163 4 8-4 11-4-11Z" fill="url(#metagem)"/>
  <text x="228" y="171" class="label">多彩孔</text>
  <text x="228" y="185" class="small muted">已镶嵌 · 当前宝石</text>
  <text x="191" y="214" class="small muted">背包可用</text>
  <g>
    <rect x="259" y="194" width="35" height="35" fill="#20192a" stroke="#3e6970"/>
    <use href="#gem" x="264" y="199" width="25" height="25" style="color:#aa6dea"/>
    <rect x="287" y="217" width="11" height="12" fill="#041318"/>
    <text x="292" y="226" class="small" text-anchor="middle">2</text>
    <rect x="302" y="194" width="35" height="35" fill="#20192a" stroke="#3e6970"/>
    <use href="#gem" x="307" y="199" width="25" height="25" style="color:#d377dc"/>
    <rect x="330" y="217" width="11" height="12" fill="#041318"/>
    <text x="335" y="226" class="small" text-anchor="middle">1</text>
    <rect x="345" y="194" width="35" height="35" fill="#20192a" stroke="#3e6970"/>
    <use href="#gem" x="350" y="199" width="25" height="25" style="color:#845fe0"/>
    <rect x="373" y="217" width="11" height="12" fill="#041318"/>
    <text x="378" y="226" class="small" text-anchor="middle">4</text>
  </g>
  <line x1="191" y1="243" x2="457" y2="243" class="line"/>

  <circle cx="208" cy="270" r="12" fill="#26191b" stroke="#e84b55" stroke-width="2"/>
  <circle cx="208" cy="270" r="5" fill="#081419" stroke="#8d343d"/>
  <text x="228" y="268" class="label">红色孔</text>
  <text x="228" y="282" class="small" fill="#f0a789">空孔 · 选择背包宝石</text>
  <text x="191" y="311" class="small muted">背包可用</text>
  <g>
    <rect x="259" y="291" width="35" height="35" fill="#321b20" stroke="#28e19a" stroke-width="2"/>
    <use href="#gem" x="264" y="296" width="25" height="25" style="color:#e94050"/>
    <rect x="287" y="314" width="11" height="12" fill="#041318"/>
    <text x="292" y="323" class="small" text-anchor="middle">3</text>
    <rect x="302" y="291" width="35" height="35" fill="#291c20" stroke="#3e6970"/>
    <use href="#gem" x="307" y="296" width="25" height="25" style="color:#df624a"/>
    <rect x="330" y="314" width="11" height="12" fill="#041318"/>
    <text x="335" y="323" class="small" text-anchor="middle">1</text>
    <rect x="345" y="291" width="35" height="35" fill="#292032" stroke="#3e6970"/>
    <use href="#gem" x="350" y="296" width="25" height="25" style="color:#a56ed6"/>
    <rect x="373" y="314" width="11" height="12" fill="#041318"/>
    <text x="378" y="323" class="small" text-anchor="middle">2</text>
  </g>
  <text x="191" y="356" class="small muted">绿框：已选择　图标角标：背包数量</text>
  <line x1="191" y1="372" x2="457" y2="372" class="line"/>

  <text x="191" y="398" class="body">本次操作</text>
  <text x="457" y="398" class="body" text-anchor="end" fill="#25e4a0">1 颗待镶嵌</text>
  <text x="191" y="418" class="small muted">原有宝石更换时先显示覆盖提示</text>
  <rect x="191" y="437" width="266" height="39" fill="#0e3d3c" stroke="#20dc95"/>
  <text x="324" y="462" class="body" font-weight="700" text-anchor="middle">镶嵌宝石</text>
  <text x="324" y="498" class="small muted" text-anchor="middle">确认后更新装备与孔位状态</text>

  <line x1="28" y1="539" x2="572" y2="539" class="line"/>
  <text x="300" y="558" class="small muted" text-anchor="middle">右键装备打开面板 · 关闭后恢复人偶 · 装备栏与增强标记保持原位</text>
</svg>
