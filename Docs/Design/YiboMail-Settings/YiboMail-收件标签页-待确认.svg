<text x="192" y="792" font-family="Microsoft YaHei" font-size="14" font-weight="400" fill="#a1bdc3">收件设置作用于原生邮箱增强；账号页面、入口、角色与字段配置仍由 Core 管理。</text>
<text x="192" y="824" font-family="Microsoft YaHei" font-size="12" font-weight="400" fill="#a1bdc3">设计状态：待确认 · 收件偏好设计稿。</text>
