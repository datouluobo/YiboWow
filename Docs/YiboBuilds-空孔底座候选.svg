  <rect width="1150" height="610" rx="14" fill="url(#panel)" stroke="#2c5157"/>
  <text class="title" x="24" y="32">装备珠宝孔底座 · 10 组候选</text>
  <text class="note" x="24" y="54">24×24 结构放大预览 ｜ 当前装备侧边图标：16×16 UI 单位（受 WoW 界面缩放影响） ｜ 红边为空孔类型示例，蓝宝石示范已镶状态</text>

  <g id="candidates">
    <g transform="translate(16 70)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">01 · 圆角切面</text><g transform="translate(28 42) scale(3)"><use href="#socket01"/></g><g transform="translate(120 42) scale(3)"><use href="#socket01"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">斜切开口，轮廓柔和</text></g>
    <g transform="translate(244 70)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">02 · 六边形嵌座</text><g transform="translate(28 42) scale(3)"><use href="#socket02"/></g><g transform="translate(120 42) scale(3)"><use href="#socket02"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">棱角明确，游戏感强</text></g>
    <g transform="translate(472 70)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">03 · 方形斜边</text><g transform="translate(28 42) scale(3)"><use href="#socket03"/></g><g transform="translate(120 42) scale(3)"><use href="#socket03"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">方形稳重，结构简洁</text></g>
    <g transform="translate(700 70)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">04 · 菱形卡槽</text><g transform="translate(28 42) scale(3)"><use href="#socket04"/></g><g transform="translate(120 42) scale(3)"><use href="#socket04"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">斜向突出，缩小时醒目</text></g>
    <g transform="translate(928 70)"><rect class="card" width="206" height="254" rx="7"/><text class="name" x="12" y="22">05 · 三爪托座</text><g transform="translate(23 42) scale(3)"><use href="#socket05"/></g><g transform="translate(115 42) scale(3)"><use href="#socket05"/><use href="#gem"/></g><text class="state" x="43" y="128">空孔</text><text class="state" x="132" y="128">镶嵌</text><text class="note" x="12" y="153">爪形强调宝石被固定</text></g>

    <g transform="translate(16 338)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">06 · 双层八角</text><g transform="translate(28 42) scale(3)"><use href="#socket06"/></g><g transform="translate(120 42) scale(3)"><use href="#socket06"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">双层边缘，层次分明</text></g>
    <g transform="translate(244 338)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">07 · 侧缺口环</text><g transform="translate(28 42) scale(3)"><use href="#socket07"/></g><g transform="translate(120 42) scale(3)"><use href="#socket07"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">侧边缺口，辨识度高</text></g>
    <g transform="translate(472 338)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">08 · 圆形内凹</text><g transform="translate(28 42) scale(3)"><use href="#socket08"/></g><g transform="translate(120 42) scale(3)"><use href="#socket08"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">圆孔自然，边缘较轻</text></g>
    <g transform="translate(700 338)"><rect class="card" width="216" height="254" rx="7"/><text class="name" x="12" y="22">09 · 铆钉护圈</text><g transform="translate(28 42) scale(3)"><use href="#socket09"/></g><g transform="translate(120 42) scale(3)"><use href="#socket09"/><use href="#gem"/></g><text class="state" x="48" y="128">空孔</text><text class="state" x="137" y="128">镶嵌</text><text class="note" x="12" y="153">金属感更强，识别稳定</text></g>
    <g transform="translate(928 338)"><rect class="card" width="206" height="254" rx="7"/><text class="name" x="12" y="22">10 · 分轨托边</text><g transform="translate(23 42) scale(3)"><use href="#socket10"/></g><g transform="translate(115 42) scale(3)"><use href="#socket10"/><use href="#gem"/></g><text class="state" x="43" y="128">空孔</text><text class="state" x="132" y="128">镶嵌</text><text class="note" x="12" y="153">断续边轨，中心更突出</text></g>
  </g>
</svg>
