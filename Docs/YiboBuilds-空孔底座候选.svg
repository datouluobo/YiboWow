<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 610" role="img" aria-labelledby="title desc">
  <title id="title">YiboBuilds 装备孔底座候选</title>
  <desc id="desc">十种装备珠宝孔底座，每种并列展示空孔与镶蓝色宝石状态。面板按 24×24 图标放大展示，游戏侧边图标当前为 16×16 UI 单位。</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#10232a"/><stop offset="1" stop-color="#07151a"/></linearGradient>
    <linearGradient id="steel" x2="0.8" y2="1"><stop stop-color="#46616a"/><stop offset=".5" stop-color="#1c353c"/><stop offset="1" stop-color="#09171c"/></linearGradient>
    <linearGradient id="rubyRim" x2="0" y2="1"><stop stop-color="#ff9b89"/><stop offset=".45" stop-color="#dc544d"/><stop offset="1" stop-color="#7e252d"/></linearGradient>
    <linearGradient id="blueGem" x2=".8" y2="1"><stop stop-color="#d8ffff"/><stop offset=".35" stop-color="#55dcff"/><stop offset="1" stop-color="#1874ce"/></linearGradient>
    <style>
      text { font-family: "Microsoft YaHei", sans-serif; }
      .title { fill:#e5f4f2; font-size:20px; font-weight:700; }
      .note { fill:#9bb8ba; font-size:13px; }
      .card { fill:#0b1b20; stroke:#24434a; stroke-width:1; }
      .name { fill:#d1e6e4; font-size:13px; font-weight:600; }
      .state { fill:#89a9ad; font-size:11px; }
      .outer { fill:url(#steel); stroke:#071014; stroke-width:1.7; stroke-linejoin:round; }
      .rim { fill:url(#rubyRim); stroke:#ffd1b1; stroke-width:.75; stroke-linejoin:round; }
      .cavity { fill:#071116; stroke:#182b30; stroke-width:.8; stroke-linejoin:round; }
      .edge { fill:none; stroke:#3c7578; stroke-width:.65; stroke-linejoin:round; }
      .gem { fill:url(#blueGem); stroke:#071014; stroke-width:1.15; stroke-linejoin:round; }
      .facet { fill:#e2ffff; opacity:.88; }
      .facet2 { fill:#2c9ce0; opacity:.9; }
      .pin { fill:#7a9ca0; stroke:#071014; stroke-width:.55; }
    </style>
