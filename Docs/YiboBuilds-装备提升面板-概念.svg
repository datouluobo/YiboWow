    <text x="40" y="229" class="small muted">肩</text><use href="#equipment" x="67" y="201" width="42" height="42"/>
    <text x="40" y="297" class="small muted">背</text><use href="#equipment" x="67" y="269" width="42" height="42"/>
    <text x="40" y="365" class="small muted">胸</text><use href="#equipment" x="67" y="337" width="42" height="42"/>
    <text x="40" y="433" class="small muted">衬</text><rect x="67" y="405" width="42" height="42" fill="#07191d" stroke="#2b6770"/>
    <text x="40" y="501" class="small muted">袍</text><use href="#equipment" x="67" y="473" width="42" height="42"/>
    <text x="40" y="569" class="small muted">腕</text><use href="#equipment" x="67" y="541" width="42" height="42"/>
    <text x="535" y="160" class="small muted">腰</text><use href="#equipment" x="490" y="132" width="42" height="42"/>
    <text x="535" y="228" class="small muted">腿</text><use href="#equipment" x="490" y="200" width="42" height="42"/>
    <text x="535" y="296" class="small muted">脚</text><use href="#equipment" x="490" y="268" width="42" height="42"/>
    <text x="535" y="364" class="small muted">戒1</text><use href="#equipment" x="490" y="336" width="42" height="42"/>
    <text x="535" y="432" class="small muted">戒2</text><use href="#equipment" x="490" y="404" width="42" height="42"/>
    <text x="535" y="500" class="small muted">饰1</text><use href="#equipment" x="490" y="472" width="42" height="42"/>
    <text x="535" y="568" class="small muted">饰2</text><use href="#equipment" x="490" y="540" width="42" height="42"/>
