  <text x="572" y="33" text-anchor="end" class="small" fill="#24df9a">概念预览</text>
  <line x1="28" y1="43" x2="572" y2="43" class="line"/>

  <g opacity=".84">
    <text x="40" y="93" class="small muted">头</text><use href="#equipment" x="67" y="65" width="42" height="42"/>
