  <text x="228" y="135" class="tiny muted">1 个孔 · 已有附魔 · 当前穿戴</text>
  <line x1="187" y1="145" x2="447" y2="145" class="line"/>

  <text x="188" y="163" class="body strong">宝石 · 已镶可更换</text>
  <text x="446" y="163" text-anchor="end" class="tiny muted">逐孔确认</text>
  <circle cx="198" cy="183" r="8" fill="#271920" stroke="#e65762" stroke-width="1.6"/>
  <path d="m198 176 5 7-5 7-5-7Z" fill="#e54c5d"/>
