  <rect x="339" y="231" width="10" height="11" fill="#041318"/>
  <text x="344" y="239" text-anchor="middle" class="tiny">3</text>
  <rect x="353" y="214" width="27" height="27" fill="#392922" stroke="#456971"/>
  <use href="#gem" x="355" y="216" width="23" height="23" style="color:#e58d4f"/>
  <rect x="373" y="231" width="10" height="11" fill="#041318"/>
