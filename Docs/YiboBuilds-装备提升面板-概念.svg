<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 600 680" role="img" aria-label="YiboBuilds 装备区中的装备提升面板概念图">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #dceff0; }
      .muted { fill: #87aeb3; }
      .tiny { font-size: 9px; }
      .small { font-size: 10px; }
      .body { font-size: 11px; }
      .strong { font-weight: 700; }
      .line { stroke: #27525a; stroke-width: 1; }
      .equip { fill: #13272c; stroke: #9255d7; stroke-width: 1.2; }
    </style>
    <linearGradient id="surface" x2="0" y2="1">
      <stop stop-color="#0b2429"/>
      <stop offset="1" stop-color="#07191e"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2="1">
      <stop stop-color="#c9a56b"/>
      <stop offset=".55" stop-color="#6d4b41"/>
      <stop offset="1" stop-color="#2a2831"/>
    </linearGradient>
    <symbol id="equipment" viewBox="0 0 38 38">
      <rect x=".5" y=".5" width="37" height="37" class="equip"/>
      <path d="M9 8 15 5l4 5 4-5 6 3-3 9-4-2v17h-6V15l-4 2Z" fill="url(#metal)" stroke="#e4ba78" stroke-width="1"/>
    </symbol>
    <symbol id="gem" viewBox="0 0 27 27">
      <path d="M13.5 2 24 9l-2 11-8.5 6L5 20 3 9Z" fill="currentColor"/>
      <path d="M3 9h21m-10.5-7L10 12l3.5 14L17 12Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1"/>
    </symbol>
  </defs>

  <rect width="600" height="680" fill="#06161b"/>
  <rect x="10" y="9" width="580" height="662" fill="#041318" stroke="#15454c"/>
