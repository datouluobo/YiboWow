  <text x="233" y="350" class="tiny" fill="#29df9b">背包 ×2 · 适用手套</text>
  <line x1="187" y1="369" x2="447" y2="369" class="line"/>

  <text x="188" y="388" class="body strong">专业提升</text>
  <rect x="188" y="397" width="258" height="38" fill="#0b2227"/>
  <rect x="195" y="402" width="29" height="29" fill="#25333a" stroke="#6aa9d9"/>
  <circle cx="209.5" cy="416.5" r="8" fill="#73a5b4" stroke="#c5e0e3"/>
  <path d="M204 416h11m-5.5-5.5v11" stroke="#23414d" stroke-width="2"/>
  <text x="233" y="412" class="small strong">工程 · 手套强化</text>
  <text x="233" y="427" class="tiny muted">已学配方 · 用时检查材料</text>
  <rect x="188" y="440" width="258" height="38" fill="#0b2227"/>
  <rect x="195" y="445" width="29" height="29" fill="#2b302f" stroke="#d3e5e5"/>
  <rect x="201" y="451" width="17" height="17" fill="#172328" stroke="#e4edeb"/>
  <circle cx="209.5" cy="459.5" r="4.5" fill="#071519" stroke="#b9d4d4"/>
  <text x="233" y="455" class="small strong">锻造 · 手套额外孔</text>
  <text x="233" y="470" class="tiny muted">已学配方 · 尚未打孔</text>
  <rect x="453" y="154" width="2" height="334" fill="#1b444c"/>
  <rect x="453" y="158" width="2" height="170" fill="#4aa0a5"/>
  <line x1="187" y1="492" x2="447" y2="492" class="line"/>
  <text x="188" y="509" class="tiny muted">按完整栏位规则筛选此装备候选</text>
  <text x="188" y="525" class="tiny muted">更多候选在面板内滚动查看</text>

  <use href="#equipment" x="276" y="565" width="42" height="42"/>
  <use href="#equipment" x="330" y="565" width="42" height="42"/>
  <text x="297" y="620" text-anchor="middle" class="small muted">主手</text>
  <text x="351" y="620" text-anchor="middle" class="small muted">副手</text>

  <line x1="28" y1="642" x2="572" y2="642" class="line"/>
  <text x="300" y="661" text-anchor="middle" class="small muted">装备格与珠宝、附魔标记保持原位及独立悬停区域</text>
