  <text x="233" y="309" class="tiny muted">已学配方 · 用时检查材料</text>
  <rect x="188" y="321" width="258" height="37" fill="#0b2227"/>
  <rect x="195" y="325" width="29" height="29" fill="#263346" stroke="#59a9e4"/>
  <path d="m201 330 18 0-3 19-12 0Z" fill="#5c9cda" stroke="#add8f2"/>
