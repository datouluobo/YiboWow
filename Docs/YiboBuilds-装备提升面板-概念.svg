  <text x="535" y="93" class="small muted">手</text>
  <rect x="488" y="62" width="46" height="46" fill="#12332e" stroke="#20df9a" stroke-width="2"/>
  <use href="#equipment" x="491" y="65" width="40" height="40"/>
  <rect x="467" y="65" width="16" height="16" fill="#211b29" stroke="#d0dce3"/>
  <circle cx="475" cy="73" r="4" fill="#061419" stroke="#eef3f4"/>
  <rect x="467" y="86" width="16" height="16" fill="#202321" stroke="#d4a63d"/>
  <path d="m473 89 6 5-6 5Z" fill="#ecbe56"/>
