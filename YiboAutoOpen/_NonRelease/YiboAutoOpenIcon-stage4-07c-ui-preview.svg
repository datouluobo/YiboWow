<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" rx="16" fill="#101719"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e1f2ef}.muted{font-size:14px;fill:#9bb4b0}.small{font-size:12px;fill:#9bb4b0}.panel{fill:#1a2527;stroke:#3a5152}</style>
  <text x="26" y="35" font-size="22" font-weight="700">YAO · 07 开口光束箱 / 阶段 4</text><text x="26" y="59" class="muted">同一 07C 骨架的实尺寸与 WoW UI 模拟；未加入材质、颜色或光效。</text>
  <defs><g id="mark" stroke="#11191B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="square"><path d="M16 1.5 29 8.8v14.4L16 30.5 3 23.2V8.8z"/><g stroke="#F4F7F6"><path d="m12 12-3.5-3.5"/><path d="M16 11.5V5.5"/><path d="m20 12 3.5-3.5"/></g><path fill="#F4F7F6" d="M6.5 13.5h19v4h-19z"/><path fill="#11191B" d="M7.5 17.5h17v2h-17z"/><path fill="#F4F7F6" d="M7.5 19.5h17v7H7.5z"/><path fill="#F4F7F6" d="M7.5 26.5h17L16 29.5z"/></g></defs>
  <rect class="panel" x="26" y="91" width="345" height="164" rx="10"/><text x="44" y="119" font-size="16" font-weight="700">原生尺寸检查</text><text class="small" x="44" y="148">24px / Broker 与紧凑列表</text><rect x="44" y="162" width="24" height="24" fill="#090e0f"/><use href="#mark" transform="translate(44 162) scale(.75)"/><text class="small" x="83" y="179">箱口、黑色开口、箱体三层清晰</text><text class="small" x="44" y="214">32px / 小地图入口</text><rect x="44" y="222" width="32" height="32" fill="#090e0f"/><use href="#mark" transform="translate(44 222)"/><text class="small" x="92" y="242">三束短光不抢过主体</text><text class="small" x="228" y="148">64px / 设置页</text><rect x="228" y="162" width="64" height="64" fill="#090e0f"/><use href="#mark" transform="translate(228 162) scale(2)"/>
  <rect class="panel" x="396" y="91" width="538" height="230" rx="10"/><text x="414" y="119" font-size="16" font-weight="700">小地图入口模拟（32px）</text><circle cx="668" cy="219" r="85" fill="#26363a" stroke="#536c6d" stroke-width="5"/><circle cx="668" cy="219" r="68" fill="#152225"/><path d="M618 195c28-32 75-34 104-2M624 245c27 21 66 20 90 0" fill="none" stroke="#314649" stroke-width="7" opacity=".8"/><circle cx="742" cy="276" r="23" fill="#070c0d" stroke="#647b79" stroke-width="2"/><use href="#mark" transform="translate(726 260)"/><text class="small" x="414" y="294">外框与深色地图边缘有分离；透明画布没有方形底。</text>
  <rect class="panel" x="26" y="280" width="345" height="234" rx="10"/><text x="44" y="308" font-size="16" font-weight="700">Broker 行（24px）</text><rect x="44" y="328" width="308" height="38" rx="5" fill="#0c1314"/><use href="#mark" transform="translate(51 335) scale(.75)"/><text x="84" y="352" font-size="14">[Yibo] 自动开包</text><text class="small" x="277" y="352">已就绪</text><rect x="44" y="374" width="308" height="38" rx="5" fill="#202e30"/><use href="#mark" transform="translate(51 381) scale(.75)"/><text x="84" y="398" font-size="14">目录容器</text><text class="small" x="318" y="398">12</text><text class="small" x="44" y="456">24px 下，箱体前面是最大亮面；</text><text class="small" x="44" y="476">黑色开口提供“已打开”的关键分隔。</text>
  <rect class="panel" x="396" y="346" width="538" height="168" rx="10"/><text x="414" y="374" font-size="16" font-weight="700">设置页条目（64px）</text><rect x="414" y="392" width="498" height="100" rx="8" fill="#0c1314"/><use href="#mark" transform="translate(438 410) scale(2)"/><text x="530" y="432" font-size="18" font-weight="700">自动开包</text><text class="muted" x="530" y="458">安全地逐个开启目录中的可拾取容器</text><text class="small" x="530" y="480">64px 只让同一骨架更清楚，不增加新图形。</text>
</svg>
