    <path d="m18.8 14 2.7-3"/>
    <!-- Raised lid and deep opening; the two shapes separate at 24px. -->
    <path d="m4.8 17.5 11.2-5 11.2 5L16 22z" fill="#F4F7F6"/>
    <path d="m4.8 17.5 11.2 4.5 11.2-4.5"/>
    <!-- Broad chest body, with only one central latch block. -->
    <path d="M5.8 19.5 16 23l10.2-3.5v6L16 29l-10.2-3.5z" fill="#F4F7F6"/>
    <path d="M13.6 23.8h4.8v3.8h-4.8z" fill="#11191B"/>
  </g>
