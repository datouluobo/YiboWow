<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
  <rect width="900" height="410" rx="16" fill="#101719"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e3f5f0}.muted{font-size:14px;fill:#9db7b1}.small{font-size:12px;fill:#9db7b1}.panel{fill:#1a2527;stroke:#3a5152}</style>
  <defs><linearGradient id="lid" x1="16" y1="10" x2="16" y2="16" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE39A"/><stop offset=".6" stop-color="#E5A242"/><stop offset="1" stop-color="#A55A22"/></linearGradient><linearGradient id="body" x1="6" y1="19" x2="26" y2="29" gradientUnits="userSpaceOnUse"><stop stop-color="#CF792D"/><stop offset=".7" stop-color="#8B421A"/><stop offset="1" stop-color="#602819"/></linearGradient><linearGradient id="energy" x1="16" y1="2" x2="16" y2="12" gradientUnits="userSpaceOnUse"><stop stop-color="#9DFFF3" stop-opacity=".9"/><stop offset="1" stop-color="#14A9A5"/></linearGradient><g id="mark"><g stroke="url(#energy)" stroke-width="2.15" stroke-linecap="round"><path d="M11.5 9c-1.05-1.25-2.35-2.55-4-4"/><path d="M16 8.5V2.5"/><path d="M20.5 9c1.05-1.25 2.35-2.55 4-4"/></g><path fill="url(#lid)" stroke="#382112" stroke-width="2.5" stroke-linejoin="round" d="M5 16 8.5 10.5h15L27 16z"/><path fill="#0D3435" stroke="#061718" stroke-width="1.7" d="M5.5 16.5h21v3h-21z"/><path fill="url(#body)" stroke="#382112" stroke-width="2.5" stroke-linejoin="round" d="M6.5 19.5h19v9h-19z"/><path fill="#F0AD50" opacity=".4" d="M8.5 21h4v5h-4z"/></g></defs>
  <text x="24" y="34" font-size="22" font-weight="700">YAO · 07D / 简洁 WoW 风格化预览</text><text class="muted" x="24" y="58">无外框 · 柔和青绿外射能量 · 暖金上掀盖与简洁箱体；透明外围未着色。</text>
  <rect class="panel" x="24" y="88" width="304" height="286" rx="10"/><text x="42" y="116" font-size="16" font-weight="700">实际尺寸</text><text class="small" x="42" y="143">24px</text><rect x="42" y="154" width="24" height="24" fill="#080d0e"/><use href="#mark" transform="translate(42 154) scale(.75)"/><text class="small" x="42" y="215">32px</text><rect x="42" y="226" width="32" height="32" fill="#080d0e"/><use href="#mark" transform="translate(42 226)"/><text class="small" x="155" y="143">64px</text><rect x="155" y="154" width="64" height="64" fill="#080d0e"/><use href="#mark" transform="translate(155 154) scale(2)"/><text class="small" x="42" y="302">盖、深色开口和箱体只保留</text><text class="small" x="42" y="322">一个大块，避免小尺寸噪点。</text>
  <rect class="panel" x="352" y="88" width="524" height="286" rx="10"/><text x="370" y="116" font-size="16" font-weight="700">WoW 深色 UI 模拟</text><circle cx="665" cy="212" r="86" fill="#25363A" stroke="#566E6E" stroke-width="5"/><circle cx="665" cy="212" r="68" fill="#132225"/><circle cx="739" cy="271" r="23" fill="#070c0d" stroke="#68837D" stroke-width="2"/><use href="#mark" transform="translate(723 255)"/><rect x="372" y="289" width="475" height="48" rx="5" fill="#0B1213"/><use href="#mark" transform="translate(384 301) scale(.75)"/><text x="418" y="324" font-size="15">[Yibo] 自动开包</text><text class="small" x="739" y="324">已就绪</text><text class="small" x="370" y="358">外射能量温和；箱盖在箱口后方保持清晰可见。</text>
</svg>
