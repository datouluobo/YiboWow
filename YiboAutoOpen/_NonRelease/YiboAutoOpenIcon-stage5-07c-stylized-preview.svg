<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
  <rect width="900" height="410" rx="16" fill="#101719"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e3f5f0}.muted{font-size:14px;fill:#9db7b1}.small{font-size:12px;fill:#9db7b1}.panel{fill:#1a2527;stroke:#3a5152}</style>
  <defs><linearGradient id="rim" x1="16" y1="13" x2="16" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE08A"/><stop offset=".55" stop-color="#E7A33E"/><stop offset="1" stop-color="#9A541E"/></linearGradient><linearGradient id="body" x1="7" y1="19" x2="25" y2="29" gradientUnits="userSpaceOnUse"><stop stop-color="#D4812E"/><stop offset=".52" stop-color="#91451B"/><stop offset="1" stop-color="#572617"/></linearGradient><linearGradient id="energy" x1="16" y1="5" x2="16" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#8BFFF3"/><stop offset="1" stop-color="#08A9A5"/></linearGradient><g id="mark"><g stroke="url(#energy)" stroke-width="2.25" stroke-linecap="round"><path d="M12 12c-1-1.15-2.2-2.25-3.5-3.2"/><path d="M16 11.5c.05-2.05.05-4.05 0-6"/><path d="M20 12c1-1.15 2.2-2.25 3.5-3.2"/></g><path fill="url(#rim)" stroke="#352114" stroke-width="2.5" stroke-linejoin="round" d="M6.5 13.5h19v4h-19z"/><path fill="#102C2D" stroke="#061718" stroke-width="1.5" d="M7.5 17.5h17v2h-17z"/><path fill="url(#body)" stroke="#352114" stroke-width="2.5" stroke-linejoin="round" d="M7.5 19.5h17v7H7.5z"/><path fill="#6A2D18" stroke="#352114" stroke-width="1.6" stroke-linejoin="round" d="M7.5 26.5h17L16 29.5z"/><path fill="#F7C75A" stroke="#452811" stroke-width="1.2" d="M14 21h4v4h-4z"/><path fill="#F2AC4B" opacity=".55" d="M9 20.8h4.2v4.8H9z"/></g></defs>
  <text x="24" y="34" font-size="22" font-weight="700">YAO · 07C / WoW 风格化预览</text><text class="muted" x="24" y="58">无外框 · 青绿柔和外射能量 · 暖金箱口与箱体；透明外围未着色。</text>
  <rect class="panel" x="24" y="88" width="304" height="286" rx="10"/><text x="42" y="116" font-size="16" font-weight="700">实际尺寸</text><text class="small" x="42" y="143">24px</text><rect x="42" y="154" width="24" height="24" fill="#080d0e"/><use href="#mark" transform="translate(42 154) scale(.75)"/><text class="small" x="42" y="215">32px</text><rect x="42" y="226" width="32" height="32" fill="#080d0e"/><use href="#mark" transform="translate(42 226)"/><text class="small" x="155" y="143">64px</text><rect x="155" y="154" width="64" height="64" fill="#080d0e"/><use href="#mark" transform="translate(155 154) scale(2)"/><text class="small" x="42" y="302">暖金大箱体保持主焦点；</text><text class="small" x="42" y="322">青绿只表达系统与外射开启。</text>
  <rect class="panel" x="352" y="88" width="524" height="286" rx="10"/><text x="370" y="116" font-size="16" font-weight="700">WoW 深色 UI 模拟</text><circle cx="665" cy="212" r="86" fill="#25363A" stroke="#566E6E" stroke-width="5"/><circle cx="665" cy="212" r="68" fill="#132225"/><circle cx="739" cy="271" r="23" fill="#070c0d" stroke="#68837D" stroke-width="2"/><use href="#mark" transform="translate(723 255)"/><rect x="372" y="289" width="475" height="48" rx="5" fill="#0B1213"/><use href="#mark" transform="translate(384 301) scale(.75)"/><text x="418" y="324" font-size="15">[Yibo] 自动开包</text><text class="small" x="739" y="324">已就绪</text><text class="small" x="370" y="358">三束光保持外射；箱口与箱体以暖金和深缝明确分层。</text>
</svg>
