<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
  <rect width="900" height="410" rx="16" fill="#101719"/>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e3f5f0}.muted{font-size:14px;fill:#9db7b1}.small{font-size:12px;fill:#9db7b1}.panel{fill:#1a2527;stroke:#3a5152}</style>
  <defs>
    <linearGradient id="frame" x1="4" y1="3" x2="28" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#20383B"/><stop offset=".52" stop-color="#081416"/><stop offset="1" stop-color="#172B2E"/></linearGradient><linearGradient id="lid" x1="16" y1="12" x2="16" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD572"/><stop offset=".55" stop-color="#D88B32"/><stop offset="1" stop-color="#8B481C"/></linearGradient><linearGradient id="body" x1="6" y1="20" x2="26" y2="29" gradientUnits="userSpaceOnUse"><stop stop-color="#C56D29"/><stop offset=".45" stop-color="#8A421B"/><stop offset="1" stop-color="#4B2417"/></linearGradient><linearGradient id="open" x1="16" y1="12" x2="16" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#6DFFF0"/><stop offset="1" stop-color="#0B817F"/></linearGradient>
    <g id="mark"><path fill="url(#frame)" stroke="#061011" stroke-width="2.5" stroke-linejoin="round" d="M16 1.5 29 8.8v14.4L16 30.5 3 23.2V8.8z"/><path fill="none" stroke="#11B6AE" stroke-width="1" stroke-linejoin="round" d="M16 3.5 27.2 9.8v12.4L16 28.5 4.8 22.2V9.8z"/><g stroke="url(#open)" stroke-width="2.5" stroke-linecap="square"><path d="M16 13.5V8.5"/><path d="m13.2 14-2.7-3"/><path d="m18.8 14 2.7-3"/></g><path fill="url(#lid)" stroke="#281914" stroke-width="2.5" stroke-linejoin="round" d="m4.8 17.5 11.2-5 11.2 5L16 22z"/><path stroke="url(#open)" stroke-width="2" d="m6.1 17.5 9.9 3.8 9.9-3.8"/><path fill="url(#body)" stroke="#281914" stroke-width="2.5" stroke-linejoin="round" d="M5.8 19.5 16 23l10.2-3.5v6L16 29l-10.2-3.5z"/><path fill="#F8CF5F" stroke="#392311" stroke-width="1.4" d="M13.6 23.8h4.8v3.8h-4.8z"/><path fill="#E7A446" opacity=".72" d="m7.3 20.8 7.6 2.6v2L7.3 23z"/><path fill="#672B17" opacity=".7" d="m24.7 20.8-7.6 2.6v2l7.6-2.4z"/></g>
  </defs>
  <text x="24" y="34" font-size="22" font-weight="700">YAO · 阶段 5 / WoW 风格化预览</text><text class="muted" x="24" y="58">深青黑金属 frame · 单条青绿识别线 · 暖金开启容器；透明外围未着色。</text>
  <rect class="panel" x="24" y="88" width="304" height="286" rx="10"/><text x="42" y="116" font-size="16" font-weight="700">实际尺寸</text><text class="small" x="42" y="143">24px</text><rect x="42" y="154" width="24" height="24" fill="#080d0e"/><use href="#mark" transform="translate(42 154) scale(.75)"/><text class="small" x="42" y="215">32px</text><rect x="42" y="226" width="32" height="32" fill="#080d0e"/><use href="#mark" transform="translate(42 226)"/><text class="small" x="155" y="143">64px</text><rect x="155" y="154" width="64" height="64" fill="#080d0e"/><use href="#mark" transform="translate(155 154) scale(2)"/><text class="small" x="42" y="302">青绿只标识开启和系列归属；</text><text class="small" x="42" y="322">箱体仍是暖金主焦点。</text>
  <rect class="panel" x="352" y="88" width="524" height="286" rx="10"/><text x="370" y="116" font-size="16" font-weight="700">WoW 深色 UI 模拟</text><circle cx="665" cy="212" r="86" fill="#25363A" stroke="#566E6E" stroke-width="5"/><circle cx="665" cy="212" r="68" fill="#132225"/><circle cx="739" cy="271" r="23" fill="#070c0d" stroke="#68837D" stroke-width="2"/><use href="#mark" transform="translate(723 255)"/><rect x="372" y="289" width="475" height="48" rx="5" fill="#0B1213"/><use href="#mark" transform="translate(384 301) scale(.75)"/><text x="418" y="324" font-size="15">[Yibo] 自动开包</text><text class="small" x="739" y="324">已就绪</text><text class="small" x="370" y="358">外框、青绿线与暖金箱体在深色 UI 内保持分层，不需背景方块。</text>
</svg>
