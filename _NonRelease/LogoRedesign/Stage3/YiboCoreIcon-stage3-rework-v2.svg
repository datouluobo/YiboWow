<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <title>YiboCore Stage 3 reworked skeleton v2</title>
  <desc>Symmetric low-detail skeleton preserving the original YiboCore hexagon, central node, and three-way connection motif, aligned to the YiboBuilds icon language.</desc>
  <rect width="760" height="360" fill="#171b1c"/>
  <style>
    .title{font:600 17px sans-serif;fill:#dce9e9}.note{font:12px sans-serif;fill:#8ea4a4}.grid{stroke:#334345;stroke-width:.5}.outer{fill:#071112;stroke:#38565a;stroke-width:2;stroke-linejoin:round}.inner{fill:#14515a}.branch{fill:#72d5cb}.nodeTop{fill:#c6fff7}.nodeSide{fill:#36aaa7}.dim{font:11px sans-serif;fill:#b9caca}
  </style>
  <defs>
    <g id="core-v2">
      <!-- straight, symmetric hexagon; no perspective skew -->
      <path class="outer" d="M16 1 29 8.5v15L16 31 3 23.5v-15z"/>
      <path class="inner" d="M16 4 26 10v12L16 28 6 22V10z"/>
      <!-- three deliberately oversized connection blocks -->
      <path class="branch" d="M14 16 6.5 11.7V8.2L16 13.7zM18 16 25.5 11.7V8.2L16 13.7zM14.25 19h3.5v8h-3.5z"/>
      <!-- simplified central node: 3 readable planes, no micro-lines -->
      <path class="nodeTop" d="m16 12.2 4.5 2.6-4.5 2.7-4.5-2.7z"/>
      <path class="nodeSide" d="m11.5 14.8 4.5 2.7v5.1l-4.5-2.6zM20.5 14.8 16 17.5v5.1l4.5-2.6z"/>
    </g>
    <pattern id="grid32" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" class="grid" fill="none"/></pattern>
  </defs>
  <text x="24" y="28" class="title">YiboCore · Stage 3 · 原图形保留 + YiboBuilds 风格骨架 v2</text>
  <text x="24" y="49" class="note">改动重点：正六边形、三块粗连接、三面中心节点；删除细线、内层分割和小于 2px 的细节。</text>
  <g transform="translate(40 82)">
    <rect width="256" height="256" fill="url(#grid32)" stroke="#607879"/>
    <use href="#core-v2" transform="scale(8)"/>
    <text x="0" y="278" class="dim">32×32 网格放大 8 倍</text>
  </g>
  <g transform="translate(360 120)">
    <text x="0" y="-20" class="dim">实尺寸预览</text>
    <g transform="translate(0)"><use href="#core-v2"/><text x="2" y="52" class="dim">32px</text></g>
    <g transform="translate(82 4) scale(.75)"><use href="#core-v2"/><text x="2" y="52" class="dim" transform="scale(1.333)">24px</text></g>
  </g>
  <g transform="translate(360 245)">
    <text x="0" y="0" class="note">本次保留：</text>
    <text x="0" y="21" class="note">• 原六边形 + 中心节点 + 三向通路</text>
    <text x="0" y="42" class="note">• 对称、粗块、少细节</text>
    <text x="0" y="63" class="note">• 参考 YiboBuilds 的小图识别策略</text>
  </g>
  <text x="24" y="348" class="note">待确认：确认 v2 骨架后，进入阶段 4 的 24/32/64px WoW UI 模拟。</text>
</svg>
