<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <title>YiboCore Stage 3 H skeleton</title>
  <desc>Editable 32px vector skeleton for the selected H silhouette direction, with 24px and 32px previews.</desc>
  <rect width="760" height="360" fill="#171b1c"/>
  <style>
    .title{font:600 17px sans-serif;fill:#dce9e9}.note{font:12px sans-serif;fill:#8ea4a4}.grid{stroke:#334345;stroke-width:.5}.outer{fill:#0b1516;stroke:#9bceca;stroke-width:1.5;stroke-linejoin:round}.inner{fill:#18484d;stroke:#061012;stroke-width:1.3;stroke-linejoin:round}.line{fill:none;stroke:#c8f4ee;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.nodeTop{fill:#d9ffff;stroke:#061012;stroke-width:1.1}.nodeSide{fill:#56b9b1;stroke:#061012;stroke-width:1.1}.dim{font:11px sans-serif;fill:#b9caca}
  </style>
  <defs>
    <g id="skeleton">
      <path class="outer" d="M16 1 30 9v14l-14 8L2 23V9z"/>
      <path class="inner" d="M16 4 27 10v11l-11 6-11-6V10z"/>
      <path class="line" d="M13 15 7 11M19 15l6-4M16 20v6"/>
      <path class="nodeTop" d="m16 12 4 2.3-4 2.4-4-2.4z"/>
      <path class="nodeSide" d="m12 14.3 4 2.4v4.3l-4-2.1zM20 14.3l-4 2.4v4.3l4-2.1z"/>
    </g>
    <pattern id="grid32" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" class="grid" fill="none"/></pattern>
  </defs>
  <text x="24" y="28" class="title">YiboCore · Stage 3 · H 32px 矢量骨架</text>
  <text x="24" y="49" class="note">目标：主体覆盖约 85% 画布；外轮廓 2–3px；连接线保持连续；不增加新意象。</text>
  <g transform="translate(40 82)">
    <rect width="256" height="256" fill="url(#grid32)" stroke="#607879"/>
    <use href="#skeleton" transform="scale(8)"/>
    <text x="0" y="278" class="dim">32×32 网格放大 8 倍</text>
  </g>
  <g transform="translate(360 120)">
    <text x="0" y="-20" class="dim">实尺寸预览</text>
    <g transform="translate(0)"><use href="#skeleton"/><text x="2" y="52" class="dim">32px</text></g>
    <g transform="translate(82 4) scale(.75)"><use href="#skeleton"/><text x="2" y="52" class="dim" transform="scale(1.333)">24px</text></g>
  </g>
  <g transform="translate(360 245)">
    <text x="0" y="0" class="note">骨架检查：</text>
    <text x="0" y="21" class="note">• 六边形外框完整</text>
    <text x="0" y="42" class="note">• 中心节点不被分支吞没</text>
    <text x="0" y="63" class="note">• 三向连接在 24px 仍连续</text>
  </g>
  <text x="24" y="348" class="note">待确认：确认 H 骨架形状后，才进入阶段 4 的 24/32/64px WoW UI 模拟。</text>
</svg>
