<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <title>YiboCore Stage 5 styled preview</title>
  <desc>Styled preview of the approved YiboCore skeleton using the YiboBuilds visual language: dark teal frame, cyan connection blocks, and a three-plane cube node.</desc>
  <rect width="900" height="560" fill="#171b1c"/>
  <style>
    .title{font:600 18px sans-serif;fill:#e7eeee}.note{font:12px sans-serif;fill:#9cafaf}.label{font:600 13px sans-serif;fill:#dce9e9}.small{font:11px sans-serif;fill:#9cafaf}.panel{fill:#252d2f;stroke:#566466}.ui{fill:#101415;stroke:#5e6a6b}.outer{fill:#111d20;stroke:#263a3d;stroke-width:1.2}.inner{fill:#075563}.inner2{fill:#0b6870}.spoke{fill:#26d7d0}.spokeShade{fill:#15999e}.cubeTop{fill:#b8fff4}.cubeLeft{fill:#2bc4be}.cubeRight{fill:#138c91}.edge{fill:none;stroke:#71ebe0;stroke-width:.7;opacity:.75}.checkerA{fill:#d7d7d7}.checkerB{fill:#a9a9a9}
  </style>
  <defs>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" class="checkerA"/><path d="M0 0h6v6H0zM6 6h6v6H6z" class="checkerB"/></pattern>
    <g id="core">
      <path class="outer" d="M16 1 29 8.5v15L16 31 3 23.5v-15z"/>
      <path class="inner" d="M16 4 26 10v12L16 28 6 22V10z"/>
      <path class="spoke" d="M14 16 6 11.4V8l10 5.7zM18 16l8-4.6V8l-10 5.7zM14.2 19h3.6v9h-3.6z"/>
      <path class="spokeShade" d="M6 11.4 14 16v3l-8-4.6zM26 11.4 18 16v3l8-4.6z"/>
      <path class="cubeTop" d="m16 12 4.5 2.6-4.5 2.7-4.5-2.7z"/>
      <path class="cubeLeft" d="m11.5 14.6 4.5 2.7v5.1l-4.5-2.6z"/>
      <path class="cubeRight" d="m20.5 14.6-4.5 2.7v5.1l4.5-2.6z"/>
    </g>
  </defs>
  <text x="24" y="30" class="title">YiboCore · Stage 5 · YiboBuilds 风格化材质预览</text>
  <text x="24" y="51" class="note">只增加大块颜色与有限高光；骨架、比例、分支末端和中心节点形状保持不变。</text>

  <g transform="translate(24 78)">
    <rect class="panel" width="260" height="185" rx="8"/>
    <text x="16" y="25" class="label">透明 Alpha 预览</text>
    <rect x="16" y="40" width="228" height="110" fill="url(#checker)"/>
    <g transform="translate(42 60) scale(2)"><use href="#core"/></g>
    <g transform="translate(137 82) scale(1)"><use href="#core"/></g>
    <g transform="translate(202 91) scale(.75)"><use href="#core"/></g>
    <text x="39" y="170" class="small">64px　　 32px　　 24px</text>
  </g>

  <g transform="translate(304 78)">
    <rect class="panel" width="572" height="185" rx="8"/>
    <text x="16" y="25" class="label">深色 Broker / 入口模拟</text>
    <rect class="ui" x="16" y="42" width="540" height="54" rx="4"/>
    <g transform="translate(31 53) scale(1.5)"><use href="#core"/></g>
    <text x="86" y="75" class="label">YiboCore</text>
    <text x="86" y="91" class="small">青绿色连接线保持系列识别，中心节点负责功能识别</text>
    <rect class="ui" x="16" y="112" width="540" height="54" rx="4"/>
    <g transform="translate(31 123) scale(1)"><use href="#core"/></g>
    <text x="65" y="145" class="label">24px 入口预览</text>
    <text x="65" y="161" class="small">没有新增细纹、光晕或背景底座</text>
  </g>

  <g transform="translate(24 292)">
    <rect class="panel" width="420" height="210" rx="8"/>
    <text x="16" y="25" class="label">材质 token 检查</text>
    <rect x="16" y="48" width="28" height="28" fill="#111d20"/><text x="56" y="67" class="small">深青黑外框</text>
    <rect x="16" y="88" width="28" height="28" fill="#075563"/><text x="56" y="107" class="small">深青色内衬</text>
    <rect x="16" y="128" width="28" height="28" fill="#26d7d0"/><text x="56" y="147" class="small">青绿色连接线</text>
    <rect x="16" y="168" width="28" height="28" fill="#b8fff4"/><text x="56" y="187" class="small">中心节点单一高光</text>
  </g>

  <g transform="translate(464 292)">
    <rect class="panel" width="412" height="210" rx="8"/>
    <text x="16" y="25" class="label">风格化检查</text>
    <text x="16" y="58" class="small">• 原六边形与三向连接未改变</text>
    <text x="16" y="88" class="small">• 颜色只强化已有结构，没有添加新物体</text>
    <text x="16" y="118" class="small">• 24px 仍优先显示轮廓、节点和连接</text>
    <text x="16" y="148" class="small">• 透明区域直达画布边缘</text>
    <text x="16" y="178" class="note">待确认：确认风格化预览后进入阶段 6 像素级修整。</text>
  </g>
</svg>
