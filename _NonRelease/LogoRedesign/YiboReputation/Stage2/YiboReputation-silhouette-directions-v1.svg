<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <title>YiboReputation silhouette directions A/B/C</title>
  <desc>Stage 2 black and teal silhouette exploration. All directions preserve the existing handshake as the primary business symbol.</desc>
  <rect width="1440" height="1080" fill="#f4f7f6"/>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#102126}
    .subtitle{font:400 16px Arial,sans-serif;fill:#496067}
    .group{font:700 20px Arial,sans-serif;fill:#102126}
    .label{font:700 16px Arial,sans-serif;fill:#102126}
    .note{font:400 13px Arial,sans-serif;fill:#496067}
    .card{fill:#fff;stroke:#cbd9d7;stroke-width:2}
    .grid{stroke:#dbe7e4;stroke-width:1}
    .dark{fill:#102126}
    .teal{fill:#20e070}
    .tealStroke{fill:none;stroke:#20e070;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
  </style>

  <text x="56" y="58" class="title">YiboReputation · Stage 2 silhouette directions</text>
  <text x="56" y="88" class="subtitle">仅保留握手主体与 YiboBuilds 化的大形状；无材质、纹理、光效或文字进入图标。</text>

  <!-- Reusable visual language: dark silhouette + one teal structural accent. -->
  <g id="handshake">
    <!-- recognizable abstract handshake: two sleeves enter from both sides and meet in a central clasp -->
    <path class="dark" d="M-91,-48 L-57,-75 L-20,-57 L8,-32 L-3,-16 L-23,-31 L-39,-18 L-20,1 L-35,18 L-63,-8 L-80,5 L-98,-16 Z"/>
    <path class="dark" d="M91,-48 L57,-75 L20,-57 L-8,-32 L3,-16 L23,-31 L39,-18 L20,1 L35,18 L63,-8 L80,5 L98,-16 Z"/>
    <path class="teal" d="M-84,-42 L-57,-63 L-30,-50 L-52,-32 L-67,-20 L-85,-25 Z"/>
    <path class="teal" d="M84,-42 L57,-63 L30,-50 L52,-32 L67,-20 L85,-25 Z"/>
    <path class="dark" d="M-26,-6 L-9,-25 L10,-9 L27,-25 L43,-8 L23,16 L8,7 L-7,24 L-24,9 Z"/>
    <path class="teal" d="M-12,-7 L0,-18 L13,-7 L2,7 Z"/>
  </g>

  <!-- A: closest to current logo, hex badge variations -->
  <text x="56" y="138" class="group">A · 原构图保留型</text>
  <text x="260" y="138" class="note">最接近当前 Logo：只替换外围结构与色彩语言</text>

  <g transform="translate(56,160)"><rect class="card" width="416" height="310" rx="16"/><text x="24" y="34" class="label">A1 · 六边形内框</text><text x="24" y="58" class="note">2 个视觉块 · 握手最大化</text>
    <g transform="translate(208,170) scale(1.35)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><path class="teal" d="M0,-102 L86,-52 L86,52 L0,102 L-86,52 L-86,-52 Z"/><path fill="#f4f7f6" d="M0,-83 L70,-42 L70,42 L0,83 L-70,42 L-70,-42 Z"/><use href="#handshake"/></g>
    <g transform="translate(56,258) scale(.22)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="82" y="266" class="note">24px</text><g transform="translate(145,258) scale(.30)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="182" y="266" class="note">32px</text></g>

  <g transform="translate(512,160)"><rect class="card" width="416" height="310" rx="16"/><text x="24" y="34" class="label">A2 · 双层徽章</text><text x="24" y="58" class="note">3 个视觉块 · 统一外框更明显</text>
    <g transform="translate(208,170) scale(1.35)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><path class="tealStroke" d="M0,-100 L86,-50 L86,50 L0,100 L-86,50 L-86,-50 Z"/><path fill="#f4f7f6" d="M0,-79 L67,-39 L67,39 L0,79 L-67,39 L-67,-39 Z"/><use href="#handshake"/></g>
    <g transform="translate(56,258) scale(.22)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="82" y="266" class="note">24px</text><g transform="translate(145,258) scale(.30)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="182" y="266" class="note">32px</text></g>

  <g transform="translate(968,160)"><rect class="card" width="416" height="310" rx="16"/><text x="24" y="34" class="label">A3 · 斜切六边形</text><text x="24" y="58" class="note">3 个视觉块 · 强化动作与握手方向</text>
    <g transform="translate(208,170) rotate(-8) scale(1.35)"><path class="dark" d="M-86,-92 L86,-92 L112,-42 L86,92 L-86,92 L-112,42 Z"/><path class="teal" d="M-73,-76 L73,-76 L92,-37 L73,76 L-73,76 L-92,37 Z"/><path fill="#f4f7f6" d="M-57,-59 L57,-59 L70,-29 L57,59 L-57,59 L-70,29 Z"/><use href="#handshake"/></g>
    <g transform="translate(56,258) scale(.22)"><path class="dark" d="M-86,-92 L86,-92 L112,-42 L86,92 L-86,92 L-112,42 Z"/><use href="#handshake"/></g><text x="82" y="266" class="note">24px</text><g transform="translate(145,258) scale(.30)"><path class="dark" d="M-86,-92 L86,-92 L112,-42 L86,92 L-86,92 L-112,42 Z"/><use href="#handshake"/></g><text x="182" y="266" class="note">32px</text></g>

  <!-- B: Core structure lightly introduced -->
  <text x="56" y="528" class="group">B · 轻量连接型</text>
  <text x="260" y="528" class="note">握手仍是主体，连接线只作为可选的系列识别</text>

  <g transform="translate(56,550)"><rect class="card" width="416" height="310" rx="16"/><text x="24" y="34" class="label">B1 · 三向短线</text><text x="24" y="58" class="note">3 个视觉块 · 中心节点不抢主体</text>
    <g transform="translate(208,170) scale(1.3)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><path fill="#f4f7f6" d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z"/><path class="tealStroke" d="M0,58 L0,96 M-50,-28 L-82,-46 M50,-28 L82,-46"/><use href="#handshake"/></g>
    <g transform="translate(56,258) scale(.22)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="82" y="266" class="note">24px</text><g transform="translate(145,258) scale(.30)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="182" y="266" class="note">32px</text></g>

  <g transform="translate(512,550)"><rect class="card" width="416" height="310" rx="16"/><text x="24" y="34" class="label">B2 · 中心节点</text><text x="24" y="58" class="note">4 个视觉块 · 更明确的账号聚合暗示</text>
    <g transform="translate(208,170) scale(1.3)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><path fill="#f4f7f6" d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z"/><path class="tealStroke" d="M0,52 L0,88 M-48,-28 L-76,-44 M48,-28 L76,-44"/><circle class="teal" cx="0" cy="0" r="18"/><use href="#handshake"/></g>
    <g transform="translate(56,258) scale(.22)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="82" y="266" class="note">24px</text><g transform="translate(145,258) scale(.30)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="182" y="266" class="note">32px</text></g>

  <g transform="translate(968,550)"><rect class="card" width="416" height="310" rx="16"/><text x="24" y="34" class="label">B3 · 断开连接</text><text x="24" y="58" class="note">3 个视觉块 · 连接结构最克制</text>
    <g transform="translate(208,170) scale(1.3)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><path class="tealStroke" d="M0,-91 L75,-48 M-75,-48 L0,-91 M0,91 L0,60"/><path fill="#f4f7f6" d="M0,-83 L70,-42 L70,42 L0,83 L-70,42 L-70,-42 Z"/><use href="#handshake"/></g>
    <g transform="translate(56,258) scale(.22)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="82" y="266" class="note">24px</text><g transform="translate(145,258) scale(.30)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g><text x="182" y="266" class="note">32px</text></g>

  <!-- C: alternative badge treatments, still based on current logo -->
  <text x="56" y="918" class="group">C · 外框重构型</text>
  <text x="260" y="918" class="note">仅改变徽章边界语言，握手比例和核心阅读保持不变</text>
  <g transform="translate(56,940)"><rect class="card" width="416" height="110" rx="16"/><text x="24" y="34" class="label">C1 · 圆角六边形</text><text x="24" y="58" class="note">圆润、亲和；2 个视觉块</text><g transform="translate(330,58) scale(.34)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><use href="#handshake"/></g></g>
  <g transform="translate(512,940)"><rect class="card" width="416" height="110" rx="16"/><text x="24" y="34" class="label">C2 · 断角徽章</text><text x="24" y="58" class="note">更偏工具/构建系统；3 个视觉块</text><g transform="translate(330,58) scale(.34)"><path class="dark" d="M-86,-92 L86,-92 L112,-42 L86,92 L-86,92 L-112,42 Z"/><use href="#handshake"/></g></g>
  <g transform="translate(968,940)"><rect class="card" width="416" height="110" rx="16"/><text x="24" y="34" class="label">C3 · 内嵌框</text><text x="24" y="58" class="note">最接近当前 Logo，迁移成本最低；2 个视觉块</text><g transform="translate(330,58) scale(.34)"><path class="dark" d="M0,-120 L104,-60 L104,60 L0,120 L-104,60 L-104,-60 Z"/><path class="teal" d="M0,-102 L86,-52 L86,52 L0,102 L-86,52 L-86,-52 Z"/><use href="#handshake"/></g></g>
</svg>
