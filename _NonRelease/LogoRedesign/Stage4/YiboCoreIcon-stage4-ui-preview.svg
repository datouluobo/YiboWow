<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <title>YiboCore Stage 4 size and WoW UI preview</title>
  <desc>Approved A solid-cube skeleton shown at 24, 32, and 64 pixels in transparent and dark WoW-like UI simulations.</desc>
  <rect width="900" height="560" fill="#171b1c"/>
  <style>
    .title{font:600 18px sans-serif;fill:#e7eeee}.note{font:12px sans-serif;fill:#9cafaf}.label{font:600 13px sans-serif;fill:#dce9e9}.small{font:11px sans-serif;fill:#9cafaf}.panel{fill:#252d2f;stroke:#566466}.ui{fill:#101415;stroke:#5e6a6b}.outer{fill:#101719;stroke:#91a6a6;stroke-width:1}.inner{fill:#879898}.spoke{fill:#e5eeee}.cube{fill:#111}.cut{fill:#eef7f7}.checkerA{fill:#d7d7d7}.checkerB{fill:#a9a9a9}
  </style>
  <defs>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" class="checkerA"/><path d="M0 0h6v6H0zM6 6h6v6H6z" class="checkerB"/></pattern>
    <g id="core">
      <path class="outer" d="M16 1 29 8.5v15L16 31 3 23.5v-15z"/>
      <path class="inner" d="M16 4 26 10v12L16 28 6 22V10z"/>
      <path class="spoke" d="M14 16 6 11.4V8l10 5.7zM18 16l8-4.6V8l-10 5.7zM14.2 19h3.6v9h-3.6z"/>
      <path class="cube" d="m16 12 4.5 2.6v5.2L16 22.4l-4.5-2.6v-5.2z"/>
      <path class="cut" d="m16 14 2.2 1.3-2.2 1.3-2.2-1.3z"/>
    </g>
  </defs>
  <text x="24" y="30" class="title">YiboCore · Stage 4 · 实尺寸与 WoW UI 模拟</text>
  <text x="24" y="51" class="note">使用已确认的同一骨架；本阶段不增加新形状，只检查尺寸、对比和透明边缘。</text>

  <g transform="translate(24 78)">
    <rect class="panel" width="260" height="185" rx="8"/>
    <text x="16" y="25" class="label">透明 Alpha 预览</text>
    <rect x="16" y="40" width="228" height="110" fill="url(#checker)"/>
    <g transform="translate(42 60) scale(2)"><use href="#core"/></g>
    <g transform="translate(137 82) scale(1)"><use href="#core"/></g>
    <g transform="translate(202 91) scale(.75)"><use href="#core"/></g>
    <text x="39" y="170" class="small">64px　　 32px　　 24px</text>
  </g>

  <g transform="translate(304 78)">
    <rect class="panel" width="572" height="185" rx="8"/>
    <text x="16" y="25" class="label">深色 Broker 行模拟</text>
    <rect class="ui" x="16" y="42" width="540" height="54" rx="4"/>
    <g transform="translate(31 53) scale(1.5)"><use href="#core"/></g>
    <text x="86" y="75" class="label">YiboCore</text>
    <text x="86" y="91" class="small">共享运行时与账号数据基础框架</text>
    <rect class="ui" x="16" y="112" width="540" height="54" rx="4"/>
    <g transform="translate(31 123) scale(1)"><use href="#core"/></g>
    <text x="65" y="145" class="label">24px Broker 入口</text>
    <text x="65" y="161" class="small">远看仍保留“六边形 + 三向连接”</text>
  </g>

  <g transform="translate(24 292)">
    <rect class="panel" width="420" height="210" rx="8"/>
    <text x="16" y="25" class="label">小地图按钮模拟</text>
    <circle class="ui" cx="92" cy="112" r="70"/>
    <circle fill="#293436" stroke="#718080" cx="92" cy="112" r="46"/>
    <g transform="translate(68 88) scale(1.5)"><use href="#core"/></g>
    <text x="190" y="92" class="small">图标大小：32px</text>
    <text x="190" y="113" class="small">背景：深色 UI</text>
    <text x="190" y="134" class="small">检查：外框不丢失</text>
    <text x="190" y="155" class="small">检查：中心节点可见</text>
  </g>

  <g transform="translate(464 292)">
    <rect class="panel" width="412" height="210" rx="8"/>
    <text x="16" y="25" class="label">本阶段检查结果</text>
    <text x="16" y="58" class="small">24px：六边形、三向连接、中心节点均可辨认</text>
    <text x="16" y="88" class="small">32px：中心立方与连接关系清晰</text>
    <text x="16" y="118" class="small">64px：骨架未改变，仅获得更多阅读空间</text>
    <text x="16" y="148" class="small">Alpha：外围保持透明，无方形底色</text>
    <text x="16" y="178" class="note">待确认：通过实尺寸可读性后，进入阶段 5 风格化材质。</text>
  </g>
</svg>
