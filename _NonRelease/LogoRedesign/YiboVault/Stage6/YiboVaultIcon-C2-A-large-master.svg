<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183b40"/><stop offset=".48" stop-color="#0b2023"/><stop offset="1" stop-color="#061619"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#1d4247"/><stop offset="1" stop-color="#10282c"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="#edf3ef"/><stop offset=".42" stop-color="#cbd9d6"/><stop offset="1" stop-color="#92aaa9"/></linearGradient>
 <linearGradient id="facet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce9e4"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="2.3"/></filter>
</defs>
<!-- soft cast shadow remains within the alpha canvas -->
<path d="M64 6 117 36v58l-53 30L11 94V36z" fill="#02090a" opacity=".58" filter="url(#shadow)"/>
<!-- beveled dark alloy shell -->
<path d="M64 4 117 34v60l-53 30L11 94V34z" fill="url(#shell)" stroke="#061416" stroke-width="2"/>
<path d="M64 11 110 37v54l-46 26L18 91V37z" fill="url(#face)" stroke="#20e070" stroke-width="3" stroke-linejoin="round"/>
<!-- restrained frame bevels -->
<path d="M64 7 112 35M16 39v52M64 116l46-26" fill="none" stroke="#416368" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
<path d="M64 17 103 39v49L64 110 25 88V39z" fill="#173236" opacity=".45"/>
<!-- bank roof and connected columns, with a straight plinth -->
<path d="M31 55 64 33 97 55v8H31z" fill="url(#silver)" stroke="#526d70" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M36 54 64 36 64 60H34z" fill="url(#facet)" opacity=".92"/>
<path d="M37 59h11v37H37zM58.5 59h11v37h-11zM80 59h11v37H80z" fill="url(#silver)" stroke="#526d70" stroke-width="1.4" stroke-linejoin="round"/>
<!-- broad column faces add depth at larger sizes -->
<path d="M38.8 62h2.4v29h-2.4zM60.3 62h2.4v29h-2.4zM81.8 62h2.4v29h-2.4z" fill="#f1f5f1" opacity=".88"/>
<path d="M45 62h3v31h-3zM66.5 62h3v31h-3zM88 62h3v31h-3z" fill="#819a99" opacity=".62"/>
<path d="M42 91h44v10H42z" fill="url(#silver)" stroke="#526d70" stroke-width="1.4"/>
<path d="M45 93h38" stroke="#f3f7f3" stroke-width="1.7" stroke-linecap="round" opacity=".9"/>
<!-- roof lip highlight -->
<path d="M36 54 64 36l28 18" fill="none" stroke="#f7faf5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
