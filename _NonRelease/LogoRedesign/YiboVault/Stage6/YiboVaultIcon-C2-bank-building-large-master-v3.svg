<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#29494d"/><stop offset=".24" stop-color="#142f33"/><stop offset=".7" stop-color="#071a1e"/><stop offset="1" stop-color="#19383c"/></linearGradient>
 <linearGradient id="chamber" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#245056"/><stop offset=".55" stop-color="#17363b"/><stop offset="1" stop-color="#0d2428"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#20e070"/><stop offset=".46" stop-color="#13b978"/><stop offset="1" stop-color="#087b59"/></linearGradient>
 <linearGradient id="roofLeft" x1="0" y1="0" x2=".65" y2="1"><stop offset="0" stop-color="#f7faf6"/><stop offset=".52" stop-color="#d3dfdc"/><stop offset="1" stop-color="#9bafaf"/></linearGradient>
 <linearGradient id="roofRight" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#cfddda"/><stop offset="1" stop-color="#788f90"/></linearGradient>
 <linearGradient id="wallLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e4e0"/><stop offset=".55" stop-color="#b6c8c5"/><stop offset="1" stop-color="#849b9c"/></linearGradient>
 <linearGradient id="wallRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2d2cf"/><stop offset="1" stop-color="#738b8c"/></linearGradient>
 <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31595b"/><stop offset="1" stop-color="#0d292e"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="2.4"/></filter>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<!-- Hex badge shadow, alloy shell, inner chamber and green series ring -->
<path d="M64 5 116 35v58l-52 30L12 93V35z" fill="#020809" opacity=".55" filter="url(#shadow)"/>
<path d="M64 3 118 34v60L64 125 10 94V34z" fill="url(#shell)" stroke="#061416" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M64 9 112 37v54L64 119 16 91V37z" fill="none" stroke="#536f71" stroke-width="1.5" stroke-linejoin="round" opacity=".72"/>
<path d="M64 14 107 39v50L64 114 21 89V39z" fill="url(#chamber)" stroke="url(#rim)" stroke-width="3.8" stroke-linejoin="round"/>
<path d="M64 14 107 39v50L64 114 21 89V39z" fill="none" stroke="#20e070" stroke-width="6" opacity=".17" filter="url(#glow)"/>
<path d="M64 6 110 33M17 40v48M64 116l42-25" fill="none" stroke="#829d9d" stroke-width="1.3" stroke-linecap="round" opacity=".68"/>
<!-- One connected bank building: roof, gable, walls, entry, windows and foundation -->
<!-- Wall mass with side plane -->
<path d="M34 57h60v31l-12 8H46l-12-8z" fill="url(#wallLeft)" stroke="#526d70" stroke-width="1.7" stroke-linejoin="round"/>
<path d="M64 58h30v30l-12 8H64z" fill="url(#wallRight)" opacity=".92"/>
<!-- Gable wall under the roof connects directly into the facade -->
<path d="M36 58 64 40l28 18v5H36z" fill="url(#wallLeft)" stroke="#526d70" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M64 41 91 59v4H64z" fill="url(#wallRight)" opacity=".88"/>
<!-- Pitched metal roof with a clear ridge and overhanging eaves -->
<path d="M27 56 63 31q1-.8 2 0l36 25q2 1.3 2 3.5V64H25v-4.5q0-2.2 2-3.5z" fill="url(#roofLeft)" stroke="#4e686b" stroke-width="2.1" stroke-linejoin="round"/>
<path d="M64 32 100 56q2 1.3 2 3.5V64H64z" fill="url(#roofRight)"/>
<path d="M32 55 64 33l31 22" fill="none" stroke="#f8fbf6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M27 62h76" stroke="#637e80" stroke-width="2.2"/>
<!-- Two framed windows inset into the joined wall mass -->
<g stroke="#536e70" stroke-width="1.5" stroke-linejoin="round">
 <path d="M39 68h13v12H39z" fill="#19383c"/><path d="M76 68h13v12H76z" fill="#19383c"/>
</g>
<path d="M41 70h9v8h-9zM78 70h9v8h-9z" fill="#c9e3df"/>
<path d="M45.5 70v8M82.5 70v8" stroke="#6f9999" stroke-width="1.1"/>
<!-- Recessed arched entrance belongs to the facade -->
<path d="M56 95V78q0-8 8-8t8 8v17z" fill="#405f61" stroke="#4d696b" stroke-width="1.5"/>
<path d="M59 95V79q0-5 5-5t5 5v16z" fill="url(#door)" stroke="#9fb5b1" stroke-width="1.1"/>
<path d="M64 75v20" stroke="#74908f" stroke-width="1.1"/>
<circle cx="67" cy="85" r="1.2" fill="#dce7df"/>
<!-- Foundation follows the lower hex interior and ends on a flat base -->
<path d="M39 93h50v5l-6 3H45l-6-3z" fill="#6f898a" stroke="#465f62" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M42 93h44v5H42z" fill="#d4e1dd" stroke="#647f81" stroke-width="1.2"/>
<path d="M45 95h38" stroke="#f8faf5" stroke-width="1.5" stroke-linecap="round"/>
</svg>
