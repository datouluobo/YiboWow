<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29494d"/><stop offset=".35" stop-color="#102a2e"/><stop offset="1" stop-color="#07191d"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#22484c"/><stop offset="1" stop-color="#10282c"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#20e070"/><stop offset=".52" stop-color="#13b976"/><stop offset="1" stop-color="#0a895f"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#edf3ef"/><stop offset=".46" stop-color="#c8d7d3"/><stop offset="1" stop-color="#91a8a8"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fbfcf8"/><stop offset=".55" stop-color="#d2dfdb"/><stop offset="1" stop-color="#97aeac"/></linearGradient>
 <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31585b"/><stop offset="1" stop-color="#102a2f"/></linearGradient>
 <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<!-- Compact Yibo hex badge with one dark-metal bevel and one green series rim -->
<path d="M64 4 117 34v60l-53 30L11 94V34z" fill="#02090a" opacity=".45" filter="url(#softShadow)"/>
<path d="M64 3 118 34v60L64 125 10 94V34z" fill="url(#shell)" stroke="#061416" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M64 13 108 38v51l-44 25L20 89V38z" fill="url(#face)" stroke="url(#rim)" stroke-width="3.6" stroke-linejoin="round"/>
<path d="M64 6 109 32" stroke="#718f90" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
<!-- A single connected house mass, with restrained large-size modeling -->
<path d="M34 59 62 38q2-1.5 4 0l28 21v33l-10 7H44l-10-7z" fill="url(#wall)" stroke="#4e696c" stroke-width="1.7" stroke-linejoin="round"/>
<!-- Pitched roof cap -->
<path d="M27 56 62 31q2-1.5 4 0l35 25q2 1.4 2 3.8V65H25v-5.2q0-2.4 2-3.8z" fill="url(#roof)" stroke="#536f72" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M33 55 64 33 94 55" fill="none" stroke="#f9fbf7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
<path d="M29 63h70" stroke="#7c9595" stroke-width="1.7"/>
<!-- Two broad windows set into the wall -->
<g stroke="#4e696c" stroke-width="1.4" stroke-linejoin="round">
 <path d="M40 70h13v11H40z" fill="#17373b"/><path d="M75 70h13v11H75z" fill="#17373b"/>
</g>
<path d="M42 72h9v7h-9zM77 72h9v7h-9z" fill="#dcebe7"/>
<path d="M46.5 72v7M81.5 72v7" stroke="#88a6a5" stroke-width="1"/>
<!-- Recessed arched entrance -->
<path d="M56 97V83q0-8 8-8t8 8v14z" fill="#607c7e" stroke="#4e696c" stroke-width="1.4"/>
<path d="M59 97V83q0-5 5-5t5 5v14z" fill="url(#door)" stroke="#d5e1dc" stroke-width="1"/>
<path d="M64 79v18" stroke="#779394" stroke-width=".9"/><circle cx="67" cy="88" r="1.1" fill="#eaf1eb"/>
<!-- Flat foundation, fully inside the hex -->
<path d="M41 96h46v5H41z" fill="#70898a" stroke="#4b6668" stroke-width="1.2"/>
<path d="M43 96h42v3H43z" fill="#d9e4df"/>
<path d="M45 97h38" stroke="#fbfcf7" stroke-width="1.3" stroke-linecap="round"/>
</svg>
