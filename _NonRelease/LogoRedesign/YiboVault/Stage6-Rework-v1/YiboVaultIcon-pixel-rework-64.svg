<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24">
<defs>
 <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12363D"/><stop offset="1" stop-color="#071A20"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2FFF9"/><stop offset=".5" stop-color="#B9D3CC"/><stop offset="1" stop-color="#789995"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F6FFF9"/><stop offset="1" stop-color="#B8D2CB"/></linearGradient>
</defs>
<!-- Regular point-up hexagonal frame, sized to the transparent canvas. -->
<path d="M12 1.1 21.44 6.55v10.9L12 22.9 2.56 17.45V6.55Z" fill="url(#badge)" stroke="#20E070" stroke-width="1.35" stroke-linejoin="round"/>
<!-- Enlarged, continuous house silhouette with the roof joined to the walls. -->
<path d="M3.85 9.35 12 3.25l8.15 6.1h-.8v7.85l-2.25 2H6.9l-2.25-2V9.35Z" fill="none" stroke="#071A20" stroke-width=".9" stroke-linejoin="round"/>
