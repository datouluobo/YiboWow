<path d="M3.85 9.35 12 3.25l8.15 6.1Z" fill="url(#roof)"/>
<!-- Clear vault doorway sized to remain readable when scaled by the UI. -->
<path d="M8.1 19.2v-3.7a3.9 3.9 0 0 1 7.8 0v3.7Z" fill="#12363D" stroke="#547C7C" stroke-width=".7" stroke-linejoin="round"/>
<path d="M9.45 19.2v-3.65a2.55 2.55 0 0 1 5.1 0v3.65" fill="none" stroke="#D6E9E2" stroke-width=".65" stroke-linecap="round"/>
<circle cx="14.15" cy="16.1" r=".6" fill="#20E070"/>
</svg>