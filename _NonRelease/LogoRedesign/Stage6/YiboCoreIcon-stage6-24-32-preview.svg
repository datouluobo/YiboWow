<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <title>YiboCore Stage 6 pixel preview — 24px and 32px only</title>
  <desc>Draft-only 24px and 32px versions. Existing production assets remain untouched and available for rollback.</desc>
  <rect width="720" height="300" fill="#171b1c"/>
  <style>
    .title{font:600 18px sans-serif;fill:#e7eeee}.note{font:12px sans-serif;fill:#9cafaf}.label{font:600 13px sans-serif;fill:#dce9e9}.small{font:11px sans-serif;fill:#9cafaf}.checkerA{fill:#d7d7d7}.checkerB{fill:#a9a9a9}.outer{fill:#111d20;stroke:#263a3d;stroke-width:1}.inner{fill:#075563}.spoke{fill:#26d7d0}.spokeShade{fill:#15999e}.cubeTop{fill:#b8fff4}.cubeLeft{fill:#2bc4be}.cubeRight{fill:#138c91}.pixel{shape-rendering:crispEdges}
  </style>
  <defs>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" class="checkerA"/><path d="M0 0h6v6H0zM6 6h6v6H6z" class="checkerB"/></pattern>
    <g id="icon32" class="pixel">
      <path class="outer" d="M16 1 29 8.5v15L16 31 3 23.5v-15z"/>
      <path class="inner" d="M16 4 26 10v12L16 28 6 22V10z"/>
      <path class="spoke" d="M14 16 6 11V8l10 5.7zM18 16l8-5V8l-10 5.7zM14 19h4v9h-4z"/>
      <path class="spokeShade" d="M6 11 14 16v3l-8-5zM26 11 18 16v3l8-5z"/>
      <path class="cubeTop" d="m16 12 4 2.5-4 2.5-4-2.5z"/>
      <path class="cubeLeft" d="m12 14.5 4 2.5v5l-4-2.5z"/>
      <path class="cubeRight" d="m20 14.5-4 2.5v5l4-2.5z"/>
    </g>
    <g id="icon24" class="pixel">
      <path class="outer" d="M12 1 22 7v10l-10 6L2 17V7z"/>
      <path class="inner" d="M12 3 20 8v8l-8 5-8-5V8z"/>
      <path class="spoke" d="M11 12 5 8.5V6l7 4.2zM13 12l6-3.5V6l-7 4.2zM11 14h2v7h-2z"/>
      <path class="spokeShade" d="M5 8.5 11 12v2l-6-3.5zM19 8.5 13 12v2l6-3.5z"/>
      <path class="cubeTop" d="m12 9 3 1.8-3 1.8-3-1.8z"/>
      <path class="cubeLeft" d="m9 10.8 3 1.8v4l-3-1.8z"/>
      <path class="cubeRight" d="m15 10.8-3 1.8v4l3-1.8z"/>
    </g>
  </defs>
  <text x="24" y="30" class="title">YiboCore · Stage 6 · 仅 24px / 32px 像素修整草案</text>
  <text x="24" y="51" class="note">正式使用中的原图未改动；本页只验证新 24px 与 32px 版本，必要时可直接回退。</text>
  <rect x="24" y="78" width="300" height="180" fill="url(#checker)"/>
  <g transform="translate(56 110) scale(4)"><use href="#icon32"/></g>
  <g transform="translate(224 132) scale(1)"><use href="#icon24"/></g>
  <text x="66" y="238" class="label">32px 草案</text><text x="227" y="238" class="label">24px 草案</text>
  <g transform="translate(370 82)">
    <text x="0" y="0" class="label">像素级检查</text>
    <text x="0" y="30" class="small">• 删除所有非结构性细线</text>
    <text x="0" y="60" class="small">• 连接线保持粗、连续、对称</text>
    <text x="0" y="90" class="small">• 中心立方保留三面色块</text>
    <text x="0" y="120" class="small">• Alpha 外围保持透明</text>
    <text x="0" y="166" class="note">待确认：先确认 24/32px 像素效果，</text>
    <text x="0" y="186" class="note">再决定是否进入正式资源替换。</text>
  </g>
</svg>
