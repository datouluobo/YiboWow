<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>YiboCrafting open recipe book skeleton A</title>
  <desc>Stage 3 grayscale 32px pixel-aware vector skeleton; transparent background.</desc>

  <!-- Concentric regular hexagons. Their 2.4px and 1.2px strokes meet without a field gap. -->
  <path d="M16 1.4 28.64 8.7v14.6L16 30.6 3.36 23.3V8.7Z"
        fill="none" stroke="#42545A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 3.05 27.21 9.525v12.95L16 28.95 4.79 22.475V9.525Z"
        fill="none" stroke="#9AADB0" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Book is 3% wider than the 90% skeleton; vertical scale stays at 90%. -->
  <g transform="translate(16 17.5) scale(0.927 0.90) translate(-16 -17.5)">
  <path d="M5.4 8.6 12.9 9.2 16 11.4 19.1 9.2 26.6 8.6v15.7l-7.7.7-2.9 2.3-2.9-2.3-7.7-.7Z"
        fill="#263940" stroke="#1C2B31" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M7.2 10.6 13 11.4 15 13.2v10.2l-2.2-.9-5.6-.6Z"
        fill="#F1F6F4"/>
  <path d="M24.8 10.6 19 11.4 17 13.2v10.2l2.2-.9 5.6-.6Z"
        fill="#A9C0C2"/>
  <path d="M16 12.5v12.4" fill="none" stroke="#263940" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
