<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>YiboCrafting refined open book for medium and large sizes</title>
  <desc>Stage 5 large-size material study; the approved 24px and 32px icons remain separate.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#344044"/>
      <stop offset="1" stop-color="#121E25"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0BD"/>
      <stop offset="0.42" stop-color="#36545A"/>
      <stop offset="1" stop-color="#0E2026"/>
    </linearGradient>
    <linearGradient id="bookRim" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE69A"/>
      <stop offset="0.48" stop-color="#F3C15F"/>
      <stop offset="1" stop-color="#D69336"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF6D3"/>
      <stop offset="0.6" stop-color="#FFE09A"/>
      <stop offset="1" stop-color="#E8AB50"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE6AC"/>
      <stop offset="0.55" stop-color="#F5C46B"/>
      <stop offset="1" stop-color="#D99038"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A96925"/>
      <stop offset="0.55" stop-color="#F4C561"/>
      <stop offset="1" stop-color="#B8782B"/>
    </linearGradient>
  </defs>

  <path d="M16 1.4 28.64 8.7v14.6L16 30.6 3.36 23.3V8.7Z"
        fill="url(#badge)" stroke="url(#metal)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 3.05 27.21 9.525v12.95L16 28.95 4.79 22.475V9.525Z"
        fill="none" stroke="#20E0C0" stroke-width="1.2" stroke-linejoin="round"/>

  <g transform="translate(16 17.5) scale(0.90) translate(-16 -17.5)">
    <!-- Gold book cover follows the small icon's approved silhouette. -->
    <path d="M5.4 8.6 12.9 9.2 16 11.4 19.1 9.2 26.6 8.6v15.7l-7.7.7-2.9 2.3-2.9-2.3-7.7-.7Z"
          fill="url(#bookRim)" stroke="#B77F29" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Broad curved page faces keep the two-block reading at 64px. -->
    <path d="M7.2 10.7c2.8-.2 5.3.5 7.8 2.5v9.9c-2.3-1.4-4.8-1.7-7.8-1.3Z"
          fill="url(#leftPage)" stroke="#B77A2C" stroke-width=".45" stroke-linejoin="round"/>
    <path d="M24.8 10.7c-2.8-.2-5.3.5-7.8 2.5v9.9c2.3-1.4 4.8-1.7 7.8-1.3Z"
          fill="url(#rightPage)" stroke="#A66D29" stroke-width=".45" stroke-linejoin="round"/>

    <!-- One readable page-edge highlight and a continuous bound spine. -->
    <path d="M8.1 11.9c2.4-.1 4.5.6 6.1 1.9" fill="none" stroke="#FFF7D8" stroke-width=".72" stroke-linecap="round"/>
    <path d="M23.9 11.9c-2.4-.1-4.5.6-6.1 1.9" fill="none" stroke="#FFE8AC" stroke-width=".65" stroke-linecap="round"/>
    <path d="M16 12.2v12.3" fill="none" stroke="url(#spine)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M7.8 22.1c3.4-.4 6.1.4 8.2 2.1 2.1-1.7 4.8-2.5 8.2-2.1"
          fill="none" stroke="#F6CC75" stroke-width=".62" stroke-linecap="round"/>
  </g>
</svg>
