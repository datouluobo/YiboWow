<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>YiboCrafting white field with gold book edge</title>
  <desc>Stage 5 color and material preview on the approved A skeleton; transparent outside.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0BD"/>
      <stop offset="0.42" stop-color="#36545A"/>
      <stop offset="1" stop-color="#0E2026"/>
    </linearGradient>
  </defs>

  <!-- Approved hexagonal structure with a deep teal metal face. -->
  <path d="M16 1.4 28.64 8.7v14.6L16 30.6 3.36 23.3V8.7Z"
        fill="url(#badge)" stroke="url(#metal)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 3.05 27.21 9.525v12.95L16 28.95 4.79 22.475V9.525Z"
        fill="none" stroke="#20E0C0" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Approved 90% book block, centered inside the full hexagonal frame. -->
  <g transform="translate(16 17.5) scale(0.927 0.90) translate(-16 -17.5)">
  <path d="M5.4 8.6 12.9 9.2 16 11.4 19.1 9.2 26.6 8.6v15.7l-7.7.7-2.9 2.3-2.9-2.3-7.7-.7Z"
        fill="#FFD272" stroke="#C58B31" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M7.2 10.6 13 11.4 15 13.2v10.2l-2.2-.9-5.6-.6Z"
        fill="#FFE3A0"/>
  <path d="M24.8 10.6 19 11.4 17 13.2v10.2l2.2-.9 5.6-.6Z"
        fill="#F1B859"/>
  <path d="M16 12.5v12.4" fill="none" stroke="#D09A3A" stroke-width="2" stroke-linecap="round"/>
  <!-- Broad top edge highlight only: no tiny text or texture. -->

  </g>
</svg>
