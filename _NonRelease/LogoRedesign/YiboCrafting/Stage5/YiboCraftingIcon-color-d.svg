<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>YiboCrafting open recipe book styled preview</title>
  <desc>Stage 5 color and material preview on the approved A skeleton; transparent outside.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#344044"/>
      <stop offset="1" stop-color="#121E25"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0BD"/>
      <stop offset="0.42" stop-color="#36545A"/>
      <stop offset="1" stop-color="#0E2026"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFF6D3"/>
      <stop offset="0.52" stop-color="#FFD87C"/>
      <stop offset="1" stop-color="#BD7431"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFE6A2"/>
      <stop offset="0.55" stop-color="#E9A84A"/>
      <stop offset="1" stop-color="#85532D"/>
    </linearGradient>
  </defs>

  <!-- Approved hexagonal structure with a deep teal metal face. -->
  <path d="M16 1.2 30 9v14L16 30.8 2 23V9Z"
        fill="url(#badge)" stroke="url(#metal)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 3.6 27.6 10.1v11.8L16 28.4 4.4 21.9V10.1Z"
        fill="none" stroke="#20E0C0" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Approved 90% book block, centered inside the full hexagonal frame. -->
  <g transform="translate(16 17.5) scale(0.90) translate(-16 -17.5)">
  <path d="M5.4 8.6 12.9 9.2 16 11.4 19.1 9.2 26.6 8.6v15.7l-7.7.7-2.9 2.3-2.9-2.3-7.7-.7Z"
        fill="#4D7890" stroke="#1D4053" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M7.2 10.6 13 11.4 15 13.2v10.2l-2.2-.9-5.6-.6Z"
        fill="url(#pageLeft)"/>
  <path d="M24.8 10.6 19 11.4 17 13.2v10.2l2.2-.9 5.6-.6Z"
        fill="url(#pageRight)"/>
  <path d="M16 12.5v12.4" fill="none" stroke="#315B70" stroke-width="2" stroke-linecap="round"/>
  <!-- Broad top edge highlight only: no tiny text or texture. -->
  <path d="m8.3 11.7 4.2.6" fill="none" stroke="#FFFCE9" stroke-width="1.3" stroke-linecap="round" opacity=".83"/>
  </g>
</svg>
