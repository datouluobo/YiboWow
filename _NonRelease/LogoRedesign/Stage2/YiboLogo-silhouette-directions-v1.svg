  <title>Yibo Logo Redesign — Stage 2 silhouette directions v1</title>
  <desc>Black and white silhouette exploration. Each cell shows a 32px preview and a 24px preview. Draft only.</desc>
  <rect width="1120" height="980" fill="#171b1c"/>
