<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <title>YiboCore A center node variants</title>
  <desc>Fixed A silhouette with connection lines terminating at the nearest hexagon intersections, showing six monochrome center-node options.</desc>
  <rect width="960" height="420" fill="#fff"/>
  <style>
    .title{font:600 20px sans-serif;fill:#111}.note{font:13px sans-serif;fill:#444}.card{fill:#f7f7f7;stroke:#c8c8c8}.label{font:600 14px sans-serif;fill:#111}.sub{font:11px sans-serif;fill:#555}.outer{fill:#111}.inner{fill:#fff}.spoke{fill:#111}.black{fill:#111}.white{fill:#fff;stroke:#111;stroke-width:1.2}.thin{fill:none;stroke:#111;stroke-width:2;stroke-linejoin:round}.small{fill:none;stroke:#111;stroke-width:1.4;stroke-linejoin:round}
  </style>
  <defs>
    <!-- A outline. The three heavy connectors terminate at the nearest inner-hex intersections. -->
    <g id="base"><path class="outer" d="M40 3 73 22v36L40 77 7 58V22z"/><path class="inner" d="M40 10 66 25v30L40 70 14 55V25z"/><path class="spoke" d="M35 38 14 26v-8l29 17zM45 38l21-12v-8L37 35zM35 48h10v22H35z"/></g>
    <g id="n1"><path class="black" d="m40 28 10 6v12l-10 6-10-6V34z"/><path class="white" d="m40 31 5 3-5 3-5-3z"/></g>
    <g id="n2"><path class="black" d="m40 28 9 5v12l-9 5-9-5V33z"/><path class="white" d="m31 33 9 5 9-5M40 38v12"/></g>
    <g id="n3"><path class="black" d="m40 28 9 5v11l-9 5-9-5V33z"/><path class="white" d="m40 31 5 3-5 3-5-3z"/><path class="white" d="M33 39h14v7l-7 3-7-3z"/></g>
    <g id="n4"><circle class="black" cx="40" cy="39" r="10"/><path class="white" d="M40 32 46 36 40 40 34 36z"/></g>
    <g id="n5"><path class="black" d="m40 29 9 5-9 5-9-5z"/><path class="black" d="M31 34h18v11l-9 5-9-5z"/><path class="white" d="m40 32 5 2-5 3-5-3z"/></g>
    <g id="n6"><path class="black" d="m40 29 8 5v10l-8 5-8-5V34z"/><path class="white" d="M40 34v15M32 34l8 5 8-5"/></g>
  </defs>
  <text x="32" y="34" class="title">YiboCore · A 方向 · 中心节点变体</text>
  <text x="32" y="58" class="note">固定：正六边形 + 三条粗连接；连接线末端对齐最近两边交点。只比较中心节点的黑白结构。</text>
  <g transform="translate(32 82)">
    <g transform="translate(0 0)"><rect class="card" width="140" height="285" rx="10"/><text x="16" y="27" class="label">1 · 实心立方</text><g transform="translate(30 42)"><use href="#base"/><use href="#n1"/></g><g transform="translate(47 166) scale(.32)"><use href="#base"/><use href="#n1"/></g><text x="39" y="207" class="sub">32px / 24px</text><text x="16" y="250" class="sub">最接近原图</text></g>
    <g transform="translate(148 0)"><rect class="card" width="140" height="285" rx="10"/><text x="16" y="27" class="label">2 · 三面立方</text><g transform="translate(30 42)"><use href="#base"/><use href="#n2"/></g><g transform="translate(47 166) scale(.32)"><use href="#base"/><use href="#n2"/></g><text x="39" y="207" class="sub">32px / 24px</text><text x="16" y="250" class="sub">空间感更强</text></g>
    <g transform="translate(296 0)"><rect class="card" width="140" height="285" rx="10"/><text x="16" y="27" class="label">3 · 分层立方</text><g transform="translate(30 42)"><use href="#base"/><use href="#n3"/></g><g transform="translate(47 166) scale(.32)"><use href="#base"/><use href="#n3"/></g><text x="39" y="207" class="sub">32px / 24px</text><text x="16" y="250" class="sub">层次清楚</text></g>
    <g transform="translate(444 0)"><rect class="card" width="140" height="285" rx="10"/><text x="16" y="27" class="label">4 · 圆心节点</text><g transform="translate(30 42)"><use href="#base"/><use href="#n4"/></g><g transform="translate(47 166) scale(.32)"><use href="#base"/><use href="#n4"/></g><text x="39" y="207" class="sub">32px / 24px</text><text x="16" y="250" class="sub">最易识别</text></g>
    <g transform="translate(592 0)"><rect class="card" width="140" height="285" rx="10"/><text x="16" y="27" class="label">5 · 平面立方</text><g transform="translate(30 42)"><use href="#base"/><use href="#n5"/></g><g transform="translate(47 166) scale(.32)"><use href="#base"/><use href="#n5"/></g><text x="39" y="207" class="sub">32px / 24px</text><text x="16" y="250" class="sub">块面最强</text></g>
    <g transform="translate(740 0)"><rect class="card" width="140" height="285" rx="10"/><text x="16" y="27" class="label">6 · 线框立方</text><g transform="translate(30 42)"><use href="#base"/><use href="#n6"/></g><g transform="translate(47 166) scale(.32)"><use href="#base"/><use href="#n6"/></g><text x="39" y="207" class="sub">32px / 24px</text><text x="16" y="250" class="sub">保留结构线</text></g>
  </g>
  <text x="32" y="400" class="note">待确认：选择一个中心节点样式（1–6）。确认后进入阶段 3，制作选定样式的 32px 矢量骨架。</text>
</svg>
