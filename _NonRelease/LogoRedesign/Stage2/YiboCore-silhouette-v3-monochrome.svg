<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <title>YiboCore monochrome silhouette directions v3</title>
  <desc>Eight high-contrast black and white silhouette directions. Every option preserves a regular hexagon, a central cube node, and three thick connections.</desc>
