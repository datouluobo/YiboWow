  <text x="32" y="34" class="title">YiboCore · 阶段 2 · 单色 silhouette 方向 v3</text>
  <text x="32" y="58" class="note">纯黑白检验：不依赖颜色、材质或发光；每项都保留正六边形、中心立方节点和三向连接。</text>
