    <g transform="translate(0 300)"><rect class="card" width="215" height="285" rx="10"/><text x="16" y="27" class="label">E · 大中心节点</text><g transform="translate(68 42)"><use href="#e"/></g><g transform="translate(95 163) scale(.32)"><use href="#e"/></g><text x="68" y="205" class="sub">32px　　 24px</text><text x="16" y="248" class="sub">节点识别优先</text></g>
    <g transform="translate(223 300)"><rect class="card" width="215" height="285" rx="10"/><text x="16" y="27" class="label">F · 粗块分支</text><g transform="translate(68 42)"><use href="#f"/></g><g transform="translate(95 163) scale(.32)"><use href="#f"/></g><text x="68" y="205" class="sub">32px　　 24px</text><text x="16" y="248" class="sub">黑白块面最强</text></g>
